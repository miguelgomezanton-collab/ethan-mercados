<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis Fundamental Automático</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #06080c;
  --s1: #0d1117;
  --s2: #161b22;
  --border: #1c2535;
  --green: #00ff87;
  --red: #ff3b5c;
  --blue: #3b82f6;
  --text: #d4dbe8;
  --text2: #5a6478;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 24px;
}

.header {
  display: flex;
  gap: 12px;
  margin-bottom: 32px;
  align-items: center;
}

#tickerInput {
  flex: 1;
  background: var(--s1);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 12px 16px;
  font-family: inherit;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.btn {
  background: var(--green);
  color: var(--bg);
  border: none;
  padding: 12px 24px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: opacity 0.2s;
}

.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.metric-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
}

.metric-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  margin-bottom: 8px;
}

.metric-value {
  font-size: 24px;
  font-weight: 700;
}

.metric-value.positive { color: var(--green); }
.metric-value.negative { color: var(--red); }
.metric-value.neutral { color: var(--text); }

.charts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  margin-bottom: 32px;
}

.chart-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}

.chart-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 16px;
  color: var(--text2);
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-bottom: 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.error {
  background: rgba(255, 59, 92, 0.1);
  border: 1px solid var(--red);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
  color: var(--red);
}

@media (max-width: 1024px) {
  .charts-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="header">
  <input type="text" id="tickerInput" placeholder="Introduce ticker (ej: AAPL, MSFT, GOOGL)" value="AAPL">
  <button class="btn" onclick="analyze()" id="analyzeBtn">ANALIZAR</button>
</div>

<div id="content">
  <div class="loading">
    <div>Introduce un ticker y haz clic en ANALIZAR</div>
  </div>
</div>

<script>
let charts = {};

async function fetchFundamentals(ticker) {
  // Una sola petición con todos los módulos necesarios
  const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=defaultKeyStatistics,financialData,summaryDetail,incomeStatementHistory,balanceSheetHistory,cashflowStatementHistory`;
  
  const proxies = [
    u => u, // Directo
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
  ];
  
  for (const proxy of proxies) {
    try {
      const proxyUrl = proxy(url);
      console.log(`Intentando: ${proxyUrl.substring(0, 100)}...`);
      
      const r = await fetch(proxyUrl, {
        signal: AbortSignal.timeout(20000),
        headers: {
          'Accept': 'application/json',
          'User-Agent': 'Mozilla/5.0'
        }
      });
      
      if (!r.ok) {
        console.warn(`HTTP ${r.status}`);
        continue;
      }
      
      const text = await r.text();
      const data = JSON.parse(text);
      
      if (data.quoteSummary?.result?.[0]) {
        console.log('✓ Datos obtenidos correctamente');
        return data.quoteSummary.result[0];
      } else if (data.quoteSummary?.error) {
        throw new Error(data.quoteSummary.error.description);
      }
    } catch(e) {
      console.warn(`Error con proxy:`, e.message);
      continue;
    }
  }
  
  throw new Error('No se pudo conectar con Yahoo Finance. Los proxies pueden estar bloqueados o el ticker no existe.');
}

function extractValue(obj) {
  return obj?.raw ?? obj?.fmt ?? obj ?? 'N/A';
}

function createChart(canvasId, config) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  
  // Destruir gráfico anterior si existe
  if (charts[canvasId]) {
    charts[canvasId].destroy();
  }
  
  charts[canvasId] = new Chart(canvas, config);
  return charts[canvasId];
}

async function analyze() {
  const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!ticker) return;
  
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  
  document.getElementById('content').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Analizando ${ticker}...</div>
    </div>
  `;
  
  try {
    const data = await fetchFundamentals(ticker);
    
    if (!data) {
      throw new Error('No se encontraron datos para este ticker');
    }
    
    renderAnalysis(ticker, data);
  } catch(err) {
    document.getElementById('content').innerHTML = `
      <div class="error">
        <strong>Error:</strong> ${err.message}
      </div>
    `;
  } finally {
    btn.disabled = false;
  }
}

function renderAnalysis(ticker, allData) {
  const stats = allData?.defaultKeyStatistics || {};
  const fin = allData?.financialData || {};
  const detail = allData?.summaryDetail || {};
  
  // Extraer métricas
  const metrics = {
    price: extractValue(detail.previousClose || detail.regularMarketPrice),
    marketCap: extractValue(detail.marketCap),
    per: extractValue(stats.trailingPE),
    peg: extractValue(stats.pegRatio),
    priceToBook: extractValue(stats.priceToBook),
    roe: extractValue(fin.returnOnEquity),
    roa: extractValue(fin.returnOnAssets),
    debtToEquity: extractValue(fin.debtToEquity),
    currentRatio: extractValue(fin.currentRatio),
    profitMargin: extractValue(fin.profitMargins),
    revenueGrowth: extractValue(fin.revenueGrowth),
    earningsGrowth: extractValue(fin.earningsGrowth)
  };
  
  // Formatear valores
  const fmt = (v, suffix = '') => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'N/A';
    if (typeof v === 'string') return v;
    return v.toFixed(2) + suffix;
  };
  
  const fmtBillions = (v) => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'N/A';
    if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
    if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
    return '$' + v.toFixed(2);
  };
  
  const fmtPct = (v) => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'N/A';
    if (typeof v === 'string') return v;
    return (v * 100).toFixed(2) + '%';
  };
  
  const getClass = (v, threshold, inverse = false) => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'neutral';
    const isGood = inverse ? v < threshold : v > threshold;
    return isGood ? 'positive' : v === threshold ? 'neutral' : 'negative';
  };
  
  // Históricos (si existen)
  const incomeHistory = allData?.incomeStatementHistory?.incomeStatementHistory || [];
  const balanceHistory = allData?.balanceSheetHistory?.balanceSheetStatements || [];
  const cashflowHistory = allData?.cashflowStatementHistory?.cashflowStatements || [];
  
  const hasHistoricalData = incomeHistory.length > 0 || balanceHistory.length > 0 || cashflowHistory.length > 0;
  
  const years = incomeHistory.map(i => {
    try {
      return new Date(i.endDate.fmt).getFullYear();
    } catch(e) {
      return 'N/A';
    }
  }).filter(y => y !== 'N/A').reverse();
  
  const revenues = incomeHistory.map(i => {
    const val = extractValue(i.totalRevenue);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const netIncome = incomeHistory.map(i => {
    const val = extractValue(i.netIncome);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const assets = balanceHistory.map(b => {
    const val = extractValue(b.totalAssets);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const liabilities = balanceHistory.map(b => {
    const val = extractValue(b.totalLiab);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const operatingCashflow = cashflowHistory.map(c => {
    const val = extractValue(c.totalCashFromOperatingActivities);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const capex = cashflowHistory.map(c => {
    const val = extractValue(c.capitalExpenditures || 0);
    return val !== 'N/A' && !isNaN(val) ? Math.abs(val) / 1e9 : 0;
  }).reverse();
  
  const fcf = operatingCashflow.map((ocf, i) => ocf - (capex[i] || 0));
  
  const html = `
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">💰 Precio</div>
        <div class="metric-value neutral">$${fmt(metrics.price)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📊 Market Cap</div>
        <div class="metric-value neutral">${fmtBillions(metrics.marketCap)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📈 PER</div>
        <div class="metric-value ${getClass(metrics.per, 25, true)}">${fmt(metrics.per)}x</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📉 PEG</div>
        <div class="metric-value ${getClass(metrics.peg, 2, true)}">${fmt(metrics.peg)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">🏆 ROE</div>
        <div class="metric-value ${getClass(metrics.roe, 0.15)}">${fmtPct(metrics.roe)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💼 ROA</div>
        <div class="metric-value ${getClass(metrics.roa, 0.05)}">${fmtPct(metrics.roa)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📊 Deuda/Equity</div>
        <div class="metric-value ${getClass(metrics.debtToEquity, 100, true)}">${fmt(metrics.debtToEquity)}%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💧 Current Ratio</div>
        <div class="metric-value ${getClass(metrics.currentRatio, 1)}">${fmt(metrics.currentRatio)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💹 Profit Margin</div>
        <div class="metric-value ${getClass(metrics.profitMargin, 0.10)}">${fmtPct(metrics.profitMargin)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📈 Revenue Growth</div>
        <div class="metric-value ${getClass(metrics.revenueGrowth, 0)}">${fmtPct(metrics.revenueGrowth)}</div>
      </div>
    </div>
    
    ${hasHistoricalData ? `
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Ingresos vs Beneficio Neto ($ Billions)</div>
        <canvas id="revenueChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Activos vs Pasivos ($ Billions)</div>
        <canvas id="balanceChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Free Cash Flow ($ Billions)</div>
        <canvas id="fcfChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Márgenes y Rentabilidad</div>
        <canvas id="marginsChart"></canvas>
      </div>
    </div>
    ` : '<div style="text-align:center;color:var(--text2);padding:40px;">No hay datos históricos disponibles para este ticker</div>'}
  `;
  
  document.getElementById('content').innerHTML = html;
  
  // Crear gráficos solo si hay datos históricos
  if (!hasHistoricalData) return;
  
  setTimeout(() => {
    // Revenue Chart
    createChart('revenueChart', {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          label: 'Ingresos',
          data: revenues,
          borderColor: '#00ff87',
          backgroundColor: 'rgba(0, 255, 135, 0.1)',
          tension: 0.4
        }, {
          label: 'Beneficio Neto',
          data: netIncome,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
          x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
        }
      }
    });
    
    // Balance Chart
    createChart('balanceChart', {
      type: 'bar',
      data: {
        labels: years,
        datasets: [{
          label: 'Activos',
          data: assets,
          backgroundColor: '#00ff87'
        }, {
          label: 'Pasivos',
          data: liabilities,
          backgroundColor: '#ff3b5c'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
          x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
        }
      }
    });
    
    // FCF Chart
    createChart('fcfChart', {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          label: 'Operating Cashflow',
          data: operatingCashflow,
          borderColor: '#00ff87',
          fill: false
        }, {
          label: 'CapEx',
          data: capex.map(v => -v),
          borderColor: '#ff3b5c',
          fill: false
        }, {
          label: 'Free Cash Flow',
          data: fcf,
          borderColor: '#fbbf24',
          backgroundColor: 'rgba(251, 191, 36, 0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
          x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
        }
      }
    });
    
    // Margins Chart
    createChart('marginsChart', {
      type: 'radar',
      data: {
        labels: ['ROE', 'ROA', 'Profit Margin', 'Revenue Growth', 'Earnings Growth'],
        datasets: [{
          label: ticker,
          data: [
            (metrics.roe || 0) * 100,
            (metrics.roa || 0) * 100,
            (metrics.profitMargin || 0) * 100,
            (metrics.revenueGrowth || 0) * 100,
            (metrics.earningsGrowth || 0) * 100
          ],
          backgroundColor: 'rgba(0, 255, 135, 0.2)',
          borderColor: '#00ff87',
          pointBackgroundColor: '#00ff87'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          r: {
            ticks: { color: '#5a6478', backdropColor: 'transparent' },
            grid: { color: '#1c2535' },
            pointLabels: { color: '#d4dbe8' }
          }
        }
      }
    });
  }, 100);
}

// Auto-analizar al cargar
window.addEventListener('load', () => {
  setTimeout(() => analyze(), 500);
});

// Enter para analizar
document.getElementById('tickerInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') analyze();
});
</script>
</body>
</html>
