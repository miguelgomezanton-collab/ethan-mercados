<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Macro Automático</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg: #06080c;
  --s1: #0d1117;
  --s2: #161b22;
  --border: #1c2535;
  --green: #00ff87;
  --red: #ff3b5c;
  --yellow: #fbbf24;
  --text: #d4dbe8;
  --text2: #5a6478;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 24px;
}

.header {
  text-align: center;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 3px;
  margin-bottom: 8px;
}

.subtitle {
  font-size: 12px;
  color: var(--text2);
  letter-spacing: 1px;
}

.main-score {
  background: var(--s1);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 40px;
  text-align: center;
  margin-bottom: 32px;
}

.main-score.bullish {
  border-color: var(--green);
  background: linear-gradient(135deg, rgba(0, 255, 135, 0.05), rgba(0, 255, 135, 0.1));
}

.main-score.bearish {
  border-color: var(--red);
  background: linear-gradient(135deg, rgba(255, 59, 92, 0.05), rgba(255, 59, 92, 0.1));
}

.main-score.neutral {
  border-color: var(--yellow);
  background: linear-gradient(135deg, rgba(251, 191, 36, 0.05), rgba(251, 191, 36, 0.1));
}

.score-number {
  font-size: 72px;
  font-weight: 700;
  margin: 16px 0;
}

.score-number.bullish { color: var(--green); }
.score-number.bearish { color: var(--red); }
.score-number.neutral { color: var(--yellow); }

.score-label {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.indicators-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-bottom: 32px;
}

.indicator-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}

.indicator-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  margin-bottom: 12px;
}

.indicator-value {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
}

.indicator-value.positive { color: var(--green); }
.indicator-value.negative { color: var(--red); }
.indicator-value.neutral { color: var(--text); }

.indicator-change {
  font-size: 11px;
  color: var(--text2);
}

.charts-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}

.chart-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
}

.chart-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 16px;
  color: var(--text2);
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}

.spinner {
  width: 32px;
  height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-bottom: 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.btn {
  background: var(--green);
  color: var(--bg);
  border: none;
  padding: 12px 24px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  border-radius: 6px;
  transition: opacity 0.2s;
  display: block;
  margin: 32px auto 0;
}

.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

@media (max-width: 1024px) {
  .charts-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="header">
  <div class="title">📊 DASHBOARD MACRO</div>
  <div class="subtitle">Análisis Automático de Indicadores Macroeconómicos</div>
</div>

<div id="content">
  <div class="loading">
    <div class="spinner"></div>
    <div>Cargando indicadores macroeconómicos...</div>
  </div>
</div>

<script>
// Datos reales del sistema macro (actualizado 14 Feb 2026)
const MACRO_DATA = {
  // Score total y zona
  totalScore: 3,
  maxScore: 17,
  zone: 'amarillo', // Soft Landing
  zoneLabel: '🟡 SOFT LANDING',
  
  // Subcategorías
  adelantados: { score: 2, max: 3 },
  monetarios: { score: 1, max: 14 },
  
  // Indicadores Adelantados (3)
  leading: {
    curvaUSD: { 
      value: 0.64, 
      label: 'Curva USD (10Y-2Y)',
      unit: '%',
      signal: 'positive',
      desc: 'Positiva = +1'
    },
    curvaEUR: { 
      value: 0.80, 
      label: 'Curva EUR (10Y-2Y)',
      unit: '%',
      signal: 'positive',
      desc: 'Positiva = +1'
    },
    lei: { 
      value: -1.2, 
      label: 'LEI (6m anualizado)',
      unit: '%',
      signal: 'neutral',
      desc: 'Zona amarilla, lejos de -4.3%'
    }
  },
  
  // Indicadores Monetarios (8, ponderados)
  monetary: {
    m2Global: { 
      value: 5.2, 
      label: 'M2 Global',
      unit: '% YoY',
      weight: 3,
      score: 3,
      signal: 'positive',
      desc: 'Peso ×3 = +3 puntos'
    },
    credito: { 
      value: 2.0, 
      label: 'Crédito vs Nominal',
      unit: '%',
      weight: 3,
      score: 0,
      signal: 'neutral',
      desc: 'Peso ×3 = 0 puntos'
    },
    impulso: { 
      value: 1.0, 
      label: 'Impulso Crediticio',
      unit: '',
      weight: 2,
      score: 2,
      signal: 'positive',
      desc: 'Peso ×2 = +2 puntos'
    },
    velocidad: { 
      value: -1.8, 
      label: 'Velocidad M2',
      unit: '%',
      weight: 2,
      score: -2,
      signal: 'negative',
      desc: 'Peso ×2 = -2 puntos'
    },
    reservas: { 
      value: 2.93, 
      label: 'Reservas Bancarias',
      unit: 'T',
      weight: 1,
      score: -1,
      signal: 'negative',
      desc: '-10.4% YoY = -1 punto'
    },
    tipoReal: { 
      value: 1.23, 
      label: 'Tipo Interés Real',
      unit: '%',
      weight: 1,
      score: -1,
      signal: 'negative',
      desc: 'Política restrictiva = -1'
    },
    spreads: { 
      value: 0.96, 
      label: 'Corporate Spreads BBB',
      unit: '%',
      weight: 1,
      score: 1,
      signal: 'positive',
      desc: 'Mínimos históricos = +1'
    },
    putCall: { 
      value: 0.60, 
      label: 'Put/Call Ratio',
      unit: '',
      weight: 1,
      score: -1,
      signal: 'negative',
      desc: '⚠️ Euforia = -1'
    }
  },
  
  // Escala de interpretación
  scale: [
    { min: 10, max: 17, zone: 'verde-oscuro', label: '🟢 Boom / Euforia' },
    { min: 4, max: 10, zone: 'verde-claro', label: '🟢 Expansión sólida' },
    { min: 0, max: 4, zone: 'amarillo', label: '🟡 Soft Landing' },
    { min: -4, max: 0, zone: 'naranja', label: '🟠 Desaceleración' },
    { min: -10, max: -4, zone: 'rojo-claro', label: '🔴 Recesión leve' },
    { min: -17, max: -10, zone: 'rojo-oscuro', label: '🔴 Recesión severa' }
  ],
  
  // Datos históricos simulados (6 meses)
  history: {
    dates: ['Sep 25', 'Oct 25', 'Nov 25', 'Dec 25', 'Jan 26', 'Feb 26'],
    totalScore: [2, 2.5, 2.8, 3.2, 3.0, 3],
    curvaUSD: [0.45, 0.52, 0.58, 0.62, 0.65, 0.64],
    m2Global: [4.8, 4.9, 5.0, 5.1, 5.2, 5.2],
    lei: [-2.1, -1.8, -1.5, -1.3, -1.2, -1.2]
  }
};

function analyze() {
  const score = MACRO_DATA.totalScore;
  const maxScore = MACRO_DATA.maxScore;
  const zone = MACRO_DATA.zone;
  const zoneLabel = MACRO_DATA.zoneLabel;
  
  const signalClass = zone === 'amarillo' ? 'neutral' : 
                      zone.includes('verde') ? 'bullish' : 'bearish';
  
  const html = `
    <div class="main-score ${signalClass}">
      <div class="score-label">Score Total Macro</div>
      <div class="score-number ${signalClass}">${score > 0 ? '+' : ''}${score}/${maxScore}</div>
      <div class="score-label">${zoneLabel}</div>
      <div style="margin-top:16px;font-size:11px;opacity:0.8;">
        Adelantados: +${MACRO_DATA.adelantados.score}/${MACRO_DATA.adelantados.max} · 
        Monetarios: +${MACRO_DATA.monetarios.score}/${MACRO_DATA.monetarios.max}
      </div>
    </div>
    
    <div style="background:var(--s1);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:32px;">
      <div style="font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px;color:var(--text2);">
        📊 Escala de Interpretación
      </div>
      <div style="display:grid;gap:8px;">
        ${MACRO_DATA.scale.map(s => `
          <div style="padding:8px 12px;background:var(--s2);border-radius:4px;display:flex;justify-content:space-between;align-items:center;${s.zone === zone ? 'border-left:4px solid var(--green);' : ''}">
            <span style="font-size:11px;">${s.label}</span>
            <span style="font-size:11px;color:var(--text2);">${s.min > 0 ? '+' : ''}${s.min} a ${s.max > 0 ? '+' : ''}${s.max}</span>
          </div>
        `).join('')}
      </div>
    </div>
    
    <div style="margin-bottom:32px;">
      <div style="font-size:14px;font-weight:600;letter-spacing:1px;margin-bottom:16px;">🔮 INDICADORES ADELANTADOS</div>
      <div class="indicators-grid">
        ${Object.entries(MACRO_DATA.leading).map(([key, ind]) => `
          <div class="indicator-card">
            <div class="indicator-title">${ind.label}</div>
            <div class="indicator-value ${ind.signal}">${ind.value > 0 ? '+' : ''}${ind.value}${ind.unit}</div>
            <div class="indicator-change">${ind.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
    
    <div style="margin-bottom:32px;">
      <div style="font-size:14px;font-weight:600;letter-spacing:1px;margin-bottom:16px;">💰 INDICADORES MONETARIOS (Ponderados)</div>
      <div class="indicators-grid">
        ${Object.entries(MACRO_DATA.monetary).map(([key, ind]) => `
          <div class="indicator-card">
            <div class="indicator-title">${ind.label} (×${ind.weight})</div>
            <div class="indicator-value ${ind.signal}">${typeof ind.value === 'number' ? (ind.value > 0 && !ind.unit.includes('T') ? '+' : '') + ind.value.toFixed(2) : ind.value}${ind.unit}</div>
            <div class="indicator-change">${ind.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
    
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Evolución Score Total</div>
        <canvas id="scoreChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Curva USD (10Y-2Y)</div>
        <canvas id="curvaChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">M2 Global (% YoY)</div>
        <canvas id="m2Chart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">LEI (% 6m anualizado)</div>
        <canvas id="leiChart"></canvas>
      </div>
    </div>
    
    <button class="btn" onclick="analyze()">⟲ ACTUALIZAR VISTA</button>
  `;
  
  document.getElementById('content').innerHTML = html;
  
  // Crear gráficos
  setTimeout(() => {
    const hist = MACRO_DATA.history;
    
    const chartOptions = {
      responsive: true,
      plugins: { legend: { labels: { color: '#d4dbe8' } } },
      scales: {
        y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
        x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
      }
    };
    
    // Score Total
    new Chart(document.getElementById('scoreChart'), {
      type: 'line',
      data: {
        labels: hist.dates,
        datasets: [{
          label: 'Score Total',
          data: hist.totalScore,
          borderColor: '#fbbf24',
          backgroundColor: 'rgba(251, 191, 36, 0.1)',
          tension: 0.4,
          fill: true
        }]
      },
      options: chartOptions
    });
    
    // Curva USD
    new Chart(document.getElementById('curvaChart'), {
      type: 'line',
      data: {
        labels: hist.dates,
        datasets: [{
          label: 'Curva USD %',
          data: hist.curvaUSD,
          borderColor: '#00ff87',
          backgroundColor: 'rgba(0, 255, 135, 0.1)',
          tension: 0.4,
          fill: true
        }]
      },
      options: chartOptions
    });
    
    // M2 Global
    new Chart(document.getElementById('m2Chart'), {
      type: 'line',
      data: {
        labels: hist.dates,
        datasets: [{
          label: 'M2 Global % YoY',
          data: hist.m2Global,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4,
          fill: true
        }]
      },
      options: chartOptions
    });
    
    // LEI
    new Chart(document.getElementById('leiChart'), {
      type: 'bar',
      data: {
        labels: hist.dates,
        datasets: [{
          label: 'LEI %',
          data: hist.lei,
          backgroundColor: hist.lei.map(v => v >= 0 ? '#00ff87' : '#ff3b5c')
        }]
      },
      options: chartOptions
    });
  }, 100);
}

// Auto-analizar al cargar
window.addEventListener('load', () => {
  setTimeout(analyze, 500);
});
</script>
</body>
</html>
