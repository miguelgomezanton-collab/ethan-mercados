<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ethan mercados · Plataforma</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230b1f1f'/><text x='16' y='22' text-anchor='middle' font-size='16' font-weight='bold' fill='%2340d9c0'>E</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Montserrat:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════
   ETHAN MERCADOS · PLATAFORMA
   Visual identity matching ethanmercados.com
   ═══════════════════════════════════════════════════════════ */

:root {
  /* Main palette from ethanmercados.com */
  --bg-deep:   #040e0e;
  --bg-dark:   #071717;
  --bg-mid:    #0b1f1f;
  --surface:   #0f2828;
  --surface2:  #133232;
  --border:    #1a3c3c;
  --border2:   #245050;

  /* Teal accent (hero glow) */
  --teal:      #40d9c0;
  --teal-dim:  rgba(64,217,192,0.06);
  --teal-mid:  rgba(64,217,192,0.15);
  --teal-glow: rgba(64,217,192,0.25);
  --teal-bright: #5eecd5;
  --teal-dark: #2ba897;

  /* Complementary */
  --cyan:      #38bdf8;
  --red:       #f47174;
  --green:     #4ade80;
  --amber:     #fbbf24;

  /* Text */
  --text1:     #f0f5f4;
  --text2:     #9cb8b4;
  --text3:     #4a706a;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--bg-deep); }

/* ══════════════════════════════════════════════════════════
   LOGIN SCREEN — Hero style like ethanmercados.com
   ══════════════════════════════════════════════════════════ */
#login-screen {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.7s ease, transform 0.7s ease;

  /* Background image (hero.jpg) with dark overlay */
  background:
    linear-gradient(180deg, rgba(4,14,14,0.45) 0%, rgba(4,14,14,0.55) 50%, rgba(4,14,14,0.85) 100%),
    url('hero.jpg') center center / cover no-repeat;
  background-color: #040e0e;
}
#login-screen::after {
  /* Subtle noise texture */
  content: '';
  position: absolute;
  inset: 0;
  opacity: 0.015;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 128px;
  pointer-events: none;
}

#login-screen.hidden {
  opacity: 0;
  transform: scale(1.02);
  pointer-events: none;
}

.login-box {
  text-align: center;
  width: 420px;
  padding: 0 20px;
  position: relative;
  z-index: 2;
}

.login-logo-img {
  height: 52px;
  margin-bottom: 40px;
  opacity: 0.95;
}

.login-heading {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px;
  font-weight: 300;
  font-style: italic;
  color: var(--text1);
  line-height: 1.15;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.login-heading em {
  font-style: italic;
  color: var(--teal);
}

.login-subtitle {
  font-family: 'Montserrat', sans-serif;
  font-size: 18px;
  font-weight: 300;
  color: var(--text2);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 48px;
}
.login-subtitle em {
  font-style: normal;
  color: var(--teal);
}

.login-field {
  margin-bottom: 14px;
}
.login-field input {
  width: 100%;
  padding: 16px 20px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text1);
  font-family: 'Montserrat', sans-serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 3px;
  outline: none;
  transition: border-color 0.3s, background 0.3s;
  backdrop-filter: blur(10px);
}
.login-field input:focus {
  border-color: var(--teal);
  background: rgba(64,217,192,0.04);
}
.login-field input::placeholder {
  color: var(--text3);
  letter-spacing: 4px;
  font-size: 11px;
  font-weight: 400;
  text-transform: uppercase;
}

.login-btn {
  width: 100%;
  padding: 16px;
  background: transparent;
  border: 1px solid var(--teal);
  color: var(--teal);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 4px;
}
.login-btn:hover {
  background: var(--teal);
  color: var(--bg-deep);
  box-shadow: 0 0 30px rgba(64,217,192,0.2);
}

.login-error {
  color: var(--red);
  font-family: 'Montserrat', sans-serif;
  font-size: 11px;
  margin-top: 16px;
  min-height: 18px;
  letter-spacing: 0.5px;
}

.login-footer {
  margin-top: 48px;
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text3);
  opacity: 0.6;
}

/* Down arrow animation like ethanmercados.com */
.login-arrow {
  position: absolute;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  color: var(--text3);
  font-size: 28px;
  animation: float 2.5s ease-in-out infinite;
  opacity: 0.4;
}
@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ══════════════════════════════════════════════════════════
   APP SHELL
   ══════════════════════════════════════════════════════════ */
#app {
  display: none;
  height: 100%;
  flex-direction: column;
}
#app.active { display: flex; }

/* ── TOPBAR ─────────────────────────────────────────────── */
.topbar {
  height: 54px;
  min-height: 54px;
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: stretch;
  z-index: 9999;
}

.brand {
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-right: 1px solid var(--border);
  min-width: 200px;
  gap: 16px;
  cursor: default;
}
.brand img {
  height: 22px;
  opacity: 0.9;
}
.brand-sep {
  width: 1px;
  height: 18px;
  background: var(--border2);
}
.brand-label {
  font-family: 'Montserrat', sans-serif;
  font-size: 8.5px;
  font-weight: 500;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text3);
}

/* ── NAV TABS ───────────────────────────────────────────── */
.nav-tabs {
  display: flex;
  align-items: stretch;
  flex: 1;
  overflow-x: auto;
}
.nav-tabs::-webkit-scrollbar { height: 0; }

.tab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text3);
  font-family: 'Montserrat', sans-serif;
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0 22px;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tab-btn:hover {
  color: var(--text2);
  background: rgba(64,217,192,0.02);
}
.tab-btn.active {
  color: var(--teal);
  border-bottom-color: var(--teal);
  background: var(--teal-dim);
}

.tab-icon { font-size: 13px; line-height: 1; }

/* ── TOPBAR RIGHT ───────────────────────────────────────── */
.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  border-left: 1px solid var(--border);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--text3);
}

.logout-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text3);
  font-family: 'Montserrat', sans-serif;
  font-size: 8px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 5px 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.logout-btn:hover {
  color: var(--red);
  border-color: var(--red);
}

/* ── IFRAMES ────────────────────────────────────────────── */
.frame-area {
  flex: 1;
  position: relative;
  overflow: hidden;
}

.module-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  background: var(--bg-deep);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.module-frame.active {
  opacity: 1;
  pointer-events: auto;
  z-index: 1;
}

/* ── LOADER ─────────────────────────────────────────────── */
.frame-loader {
  position: absolute;
  inset: 0;
  background: var(--bg-deep);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: opacity 0.4s;
}
.frame-loader.hidden { opacity: 0; pointer-events: none; }

.loader-ring {
  width: 32px;
  height: 32px;
  border: 1.5px solid var(--border);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loader-text {
  font-family: 'Montserrat', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--text3);
  text-transform: uppercase;
}

/* ── STATUS BAR ─────────────────────────────────────────── */
.status-bar {
  height: 24px;
  min-height: 24px;
  background: var(--bg-dark);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 24px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text3);
}
.status-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--teal);
  display: inline-block;
  animation: pulse-dot 2.5s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 0.9; }
  50% { opacity: 0.2; }
}

/* ── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 900px) {
  .tab-btn { padding: 0 12px; font-size: 8.5px; }
  .tab-btn .tab-label { display: none; }
  .tab-btn .tab-icon { font-size: 16px; }
  .brand { min-width: auto; padding: 0 14px; }
  .brand img { height: 18px; }
  .brand-sep, .brand-label { display: none; }
  .topbar-right span { display: none; }
  .login-heading { font-size: 38px; }
}
@media (max-width: 600px) {
  .tab-btn { padding: 0 8px; }
  .topbar-right { padding: 0 10px; }
  .login-heading { font-size: 32px; }
  .login-box { width: 100%; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════════
     LOGIN SCREEN
     ══════════════════════════════════════════════════════════ -->
<div id="login-screen">
  <div class="login-box">
    <img src="https://ethanmercados.com/wp-content/uploads/2024/03/logo-ethan-mercados-negativo.png"

    <div class="login-heading">Inversión <em>consciente</em></div>
    <div class="login-subtitle">Invierte <em>Crece</em> Disfruta</div>

      <input type="password" id="login-pass" placeholder="Contraseña" autofocus

    <div class="login-error" id="login-error"></div>
    <div class="login-footer">Plataforma privada · Acceso restringido</div>
  </div>
  <div class="login-arrow">↓</div>
</div>

<!-- ══════════════════════════════════════════════════════════
     APP SHELL
     ══════════════════════════════════════════════════════════ -->

      </button>

    </div>
    <iframe class="module-frame" id="frame-screener"  src="ethan-app.html"></iframe>
    <iframe class="module-frame"        id="frame-sp500"     srcdoc="<!DOCTYPE html>
<html lang=&quot;es&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>ETHAN · Screener S&amp;P 500</title>
<style>
:root {
  --bg: #06080c;
  --s1: #0d1117;
  --s2: #161b22;
  --border: #1c2535;
  --green: #00ff87;
  --red: #ff3b5c;
  --yellow: #fbbf24;
  --text: #d4dbe8;
  --text2: #5a6478;
  --text3: #2e3440;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 24px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.title {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
  letter-spacing: 1px;
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn {
  background: var(--green);
  color: var(--bg);
  border: none;
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: opacity 0.2s;
}

.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.status {
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 1px;
}

.progress-bar {
  height: 4px;
  background: var(--s2);
  margin-bottom: 20px;
  overflow: hidden;
  display: none;
}

.progress-bar.active { display: block; }

.progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
}

.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}

.filter label {
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.filter select, .filter input {
  background: var(--s1);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 11px;
}

.results-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.results-table thead {
  background: var(--s2);
  position: sticky;
  top: 0;
  z-index: 10;
}

.results-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
}

.results-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.results-table tr:hover {
  background: var(--s1);
}

.ticker-cell {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
}

.score-cell {
  font-weight: 700;
  font-size: 16px;
}

.score-green { color: var(--green); }
.score-yellow { color: var(--yellow); }
.score-gray { color: var(--text2); }

.estado-listo { color: var(--green); }
.estado-espera { color: var(--yellow); }
.estado-cerca { color: var(--text2); }

.sector-cell {
  font-size: 10px;
  opacity: 0.7;
}

.sector-strong {
  color: var(--green);
  opacity: 1;
  font-weight: 600;
}

.btn-add {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 4px 10px;
  font-size: 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-add:hover {
  border-color: var(--green);
  color: var(--green);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}

.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-right: 10px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

  <div>

</div>

<div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;>

<div class=&quot;filters&quot;>

    <label>Score Mínimo:</label>
    <select id=&quot;filterScore&quot; onchange=&quot;renderResults()&quot;>
      <option value=&quot;0&quot;>Todos</option>
      <option value=&quot;6&quot;>≥ 6</option>
      <option value=&quot;7&quot; selected>≥ 7</option>
      <option value=&quot;8&quot;>≥ 8</option>
      <option value=&quot;9&quot;>≥ 9</option>

      <option value=&quot;diario&quot;>Espera Diario</option>
      <option value=&quot;close&quot;>Cerca</option>
    </select>
  </div>
  <div class=&quot;filter&quot;>
    <label>Sector:</label>
    <select id=&quot;filterSector&quot; onchange=&quot;renderResults()&quot;>
      <option value=&quot;all&quot;>Todos</option>

// Indicadores (copiados del sistema ETHAN)
function sma(arr,p){return arr.map((_,i)=>{if(i<p-1)return null;const sl=arr.slice(i-p+1,i+1).filter(v=>v!=null&&!isNaN(v));return sl.length===p?sl.reduce((a,b)=>a+b,0)/p:null;});}
function ema(arr,p){const k=2/(p+1),out=new Array(arr.length).fill(null);let s=arr.findIndex(v=>v!=null&&!isNaN(v));if(s<0)return out;out[s]=arr[s];for(let i=s+1;i<arr.length;i++){const v=(arr[i]!=null&&!isNaN(arr[i]))?arr[i]:out[i-1];out[i]=v*k+out[i-1]*(1-k);}return out;}
function macd(closes){const ef=ema(closes,12),es=ema(closes,26);const m=ef.map((v,i)=>(v!=null&&es[i]!=null)?v-es[i]:null);const sl=ema(m.map(v=>v??0),9);return{m,sl};}
function rsi(closes,p=14){const out=new Array(closes.length).fill(null);if(closes.length<p+1)return out;let g=0,l=0;for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];d>0?g+=d:l-=d;}let ag=g/p,al=l/p;out[p]=al===0?100:100-(100/(1+ag/al));for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;out[i]=al===0?100:100-(100/(1+ag/al));}return out;}
function stoch(highs,lows,closes,p){const rawK=closes.map((c,i)=>{if(i<p-1)return null;const hh=Math.max(...highs.slice(i-p+1,i+1));const ll=Math.min(...lows.slice(i-p+1,i+1));return hh===ll?50:(c-ll)/(hh-ll)*100;});const k=sma(rawK,3);const d=sma(k.map(v=>v??0),3);return{k,d};}
function resample(ts,opens,highs,lows,closes,vols,freq){const groups={};ts.forEach((t,i)=>{const dd=new Date(t*1000);let key;if(freq==='W'){const day=dd.getDay();const diff=dd.getDate()-day+(day===0?-6:1);const mo=new Date(+dd);mo.setDate(diff);key=mo.toISOString().slice(0,10);}else{key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}`;}if(!groups[key]){groups[key]={o:opens[i],h:highs[i],l:lows[i],c:closes[i],v:vols[i]};}else{groups[key].h=Math.max(groups[key].h,highs[i]);groups[key].l=Math.min(groups[key].l,lows[i]);groups[key].c=closes[i];groups[key].v+=vols[i];}});const keys=Object.keys(groups).sort();return{dates:keys,opens:keys.map(k=>groups[k].o),highs:keys.map(k=>groups[k].h),lows:keys.map(k=>groups[k].l),closes:keys.map(k=>groups[k].c),vols:keys.map(k=>groups[k].v)};}

async function fetchData(ticker){
  const yUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=10y&events=history`;
  const proxies=[
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
    u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u=>`https://thingproxy.freeboard.io/fetch/${u}`,
  ];
  let lastErr;
  for(const fn of proxies){
    try{
      const r=await fetch(fn(yUrl),{signal:AbortSignal.timeout(12000)});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const j=JSON.parse(await r.text());
      if(j.chart?.error)throw new Error(j.chart.error.description);
      const res=j.chart.result[0];
      const q=res.indicators.quote[0];
      const adj=res.indicators.adjclose?.[0]?.adjclose||q.close;
      const ratio=adj.map((a,i)=>(q.close[i]&&a)?a/q.close[i]:1);
      return{
        timestamps:res.timestamp,
        opens:q.open.map((v,i)=>v*ratio[i]),
        highs:q.high.map((v,i)=>v*ratio[i]),
        lows:q.low.map((v,i)=>v*ratio[i]),
        closes:adj,
        vols:q.volume,
      };
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('Sin conexión');
}

function analyzeQuick(raw){
  const{timestamps,opens,highs,lows,closes,vols}=raw;
  const n=closes.length;
  const W=resample(timestamps,opens,highs,lows,closes,vols,'W');
  const M=resample(timestamps,opens,highs,lows,closes,vols,'M');
  
  const m_macd=macd(M.closes);
  const m_s89=stoch(M.highs,M.lows,M.closes,89);
  const m_s8=stoch(M.highs,M.lows,M.closes,8);
  const m_rsi=rsi(M.closes,14);
  const m_sma10=sma(M.closes,10);
  const mi=M.closes.length-1;
  
  const w_macd=macd(W.closes);
  const w_s89=stoch(W.highs,W.lows,W.closes,89);
  const w_rsi=rsi(W.closes,14);
  const w_sma20=sma(W.closes,20);
  const wi=W.closes.length-1;
  
  const d_macd=macd(closes);
  const d_rsi=rsi(closes,14);
  const di=n-1;
  
  let score=0;
  const mc_ok=[
    m_macd.m[mi]>0&&m_macd.m[mi]>m_macd.sl[mi],
    (m_s89.k[mi]>80&&m_s89.k[mi]>m_s89.d[mi])||m_s89.k[mi]>92,
    m_rsi[mi]>65,
    m_s8.k[mi]>78,
    m_sma10[mi]&&M.closes[mi]>m_sma10[mi]
  ];
  const sc_ok=[
    w_macd.m[wi]>0&&w_macd.m[wi]>w_macd.sl[wi],
    (w_s89.k[wi]>85&&w_s89.k[wi]>w_s89.d[wi])||w_s89.k[wi]>92,
    w_rsi[wi]>67,
    w_sma20[wi]&&W.closes[wi]>w_sma20[wi]
  ];
  
  score=mc_ok.filter(x=>x).length+sc_ok.filter(x=>x).length;
  
  const mensualOk=mc_ok.every(x=>x);
  const semanalOk=sc_ok.every(x=>x);
  const dailyReady=d_macd.m[di]>d_macd.sl[di]&&d_macd.m[di-1]<=d_macd.sl[di-1]&&d_rsi[di]>57&&d_macd.m[di]>0;
  
  let estado='watching';
  if(mensualOk&&semanalOk&&dailyReady)estado='ready';
  else if(mensualOk&&semanalOk)estado='diario';
  else if(score>=7)estado='close';
  
  return{score,estado,price:closes[di]};
}

    try{
      const raw=await fetchData(ticker);
      const result=analyzeQuick(raw);
      result.ticker=ticker;
      result.sector=SECTOR_MAP[ticker]||null;
      scanResults.push(result);
      
      if(result.score>=7){
        renderResults();
      }
    }catch(err){
      // Ignorar errores y continuar
    }
  }
  
  scanning=false;
  btn.disabled=false;
  progress.classList.remove('active');
  status.textContent=`Completado: ${scanResults.length} valores escaneados`;
  renderResults();
}

function renderResults(){
  const minScore=parseInt(document.getElementById('filterScore').value);
  const filterEstado=document.getElementById('filterEstado').value;
  const filterSector=document.getElementById('filterSector').value;
  
  let filtered=scanResults.filter(r=>{
    if(r.score<minScore)return false;
    if(filterEstado!=='all'&&r.estado!==filterEstado)return false;
    if(filterSector!=='all'&&r.sector!==filterSector)return false;
    return true;
  });
  
  filtered.sort((a,b)=>b.score-a.score);
  
  if(filtered.length===0){
    document.getElementById('resultsContainer').innerHTML=`
      <div class="empty-state">
        <div>No se encontraron valores que cumplan los filtros</div>
      </div>
    `;
    return;
  }
  
  const rows=filtered.map(r=>{
    const scoreClass=r.score>=9?'score-green':r.score>=7?'score-yellow':'score-gray';
    const estadoClass=r.estado==='ready'?'estado-listo':r.estado==='diario'?'estado-espera':'estado-cerca';
    const estadoText={'ready':'🟢 LISTO','diario':'⏳ ESPERA DIARIO','close':'🔶 CERCA','watching':'👁 VIGILANDO'}[r.estado];
    
    return`
      <tr>
        <td class="ticker-cell">${r.ticker}</td>
        <td class="sector-cell">${r.sector?SECTOR_NAMES[r.sector]:'-'}</td>
        <td class="score-cell ${scoreClass}">${r.score}/10</td>
        <td class="${estadoClass}">${estadoText}</td>
        <td>${r.price?r.price.toFixed(2):'-'}</td>
        <td><button class="btn-add" onclick="addToWatchlist('${r.ticker}')">+ Watchlist</button></td>
      </tr>
    `;
  }).join('');
  
  document.getElementById('resultsContainer').innerHTML=`
    <table class="results-table">
      <thead>
        <tr>
          <th>TICKER</th>
          <th>SECTOR</th>
          <th>SCORE</th>
          <th>ESTADO</th>
          <th>PRECIO</th>
          <th>ACCIÓN</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function addToWatchlist(ticker){
  alert(`${ticker} añadido al watchlist (función pendiente de implementar)`);
}

window.addEventListener('load',()=>{
  setTimeout(startScan,1000);
});
</script>

</head>
<body>

<div class=&quot;header&quot;>
  <div class=&quot;subtitle&quot;>Dashboard Ejecutivo · RF vs RV · Indicadores Macro</div>
</div>

<div class=&quot;tabs&quot;>
  <button class=&quot;tab active&quot; onclick=&quot;switchTabInternal('dashboard')&quot;>📊 Asset Allocation</button>
  <button class=&quot;tab&quot; onclick=&quot;switchTabInternal('params')&quot;>🔬 Parámetros</button>
</div>

<div id=&quot;content&quot;>
  <div class=&quot;loading&quot;>
    <div class=&quot;spinner&quot;></div>
    <div>Analizando mercados...</div>
  </div>
</div>

<script>
let allData = null;
let currentTab = 'dashboard';

function sma(arr,p){return arr.map((_,i)=>{if(i<p-1)return null;const sl=arr.slice(i-p+1,i+1).filter(v=>v!=null&&!isNaN(v));return sl.length===p?sl.reduce((a,b)=>a+b,0)/p:null;});}
function ema(arr,p){const k=2/(p+1),out=new Array(arr.length).fill(null);let s=arr.findIndex(v=>v!=null&&!isNaN(v));if(s<0)return out;out[s]=arr[s];for(let i=s+1;i<arr.length;i++){const v=(arr[i]!=null&&!isNaN(arr[i]))?arr[i]:out[i-1];out[i]=v*k+out[i-1]*(1-k);}return out;}
function macd(closes){const ef=ema(closes,12),es=ema(closes,26);const m=ef.map((v,i)=>(v!=null&&es[i]!=null)?v-es[i]:null);const sl=ema(m.map(v=>v??0),9);return{m,sl};}
function rsi(closes,p=14){const out=new Array(closes.length).fill(null);if(closes.length<p+1)return out;let g=0,l=0;for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];d>0?g+=d:l-=d;}let ag=g/p,al=l/p;out[p]=al===0?100:100-(100/(1+ag/al));for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;out[i]=al===0?100:100-(100/(1+ag/al));}return out;}
function stoch(highs,lows,closes,p){const rawK=closes.map((c,i)=>{if(i<p-1)return null;const hh=Math.max(...highs.slice(i-p+1,i+1));const ll=Math.min(...lows.slice(i-p+1,i+1));return hh===ll?50:(c-ll)/(hh-ll)*100;});const k=sma(rawK,3);const d=sma(k.map(v=>v??0),3);return{k,d};}
function resample(ts,opens,highs,lows,closes,vols,freq){const groups={};ts.forEach((t,i)=>{const dd=new Date(t*1000);let key;if(freq==='W'){const day=dd.getDay();const diff=dd.getDate()-day+(day===0?-6:1);const mo=new Date(+dd);mo.setDate(diff);key=mo.toISOString().slice(0,10);}else{key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}`;}if(!groups[key]){groups[key]={o:opens[i],h:highs[i],l:lows[i],c:closes[i],v:vols[i]};}else{groups[key].h=Math.max(groups[key].h,highs[i]);groups[key].l=Math.min(groups[key].l,lows[i]);groups[key].c=closes[i];groups[key].v+=vols[i];}});const keys=Object.keys(groups).sort();return{dates:keys,opens:keys.map(k=>groups[k].o),highs:keys.map(k=>groups[k].h),lows:keys.map(k=>groups[k].l),closes:keys.map(k=>groups[k].c),vols:keys.map(k=>groups[k].v)};}

const ASSETS = [
  { ticker: 'VTI', name: 'Vanguard Total Stock Market', type: 'RV', region: '🇺🇸 USA', category: 'allocation' },
  { ticker: 'VEU', name: 'Vanguard FTSE All-World ex-US', type: 'RV', region: '🌍 Mundo', category: 'allocation' },
  { ticker: 'IEF', name: 'iShares 7-10Y Treasury Bond', type: 'RF', region: '🇺🇸 USA', category: 'allocation' },
  { ticker: 'BNDX', name: 'Vanguard Total Intl Bond', type: 'RF', region: '🌍 Mundo', category: 'allocation' },
  { ticker: 'SPY', name: 'S&P 500 ETF', type: 'INDEX', region: '📊 S&P 500', category: 'indicator' },
  { ticker: 'GLD', name: 'SPDR Gold Trust', type: 'GOLD', region: '🥇 Oro', category: 'indicator' },
  { ticker: 'USO', name: 'United States Oil Fund', type: 'OIL', region: '🛢️ Petróleo', category: 'indicator' },
  { ticker: 'HYG', name: 'iShares High Yield Corp Bond', type: 'HY', region: '💳 Corp', category: 'indicator' },
  { ticker: 'EURUSD=X', name: 'Euro/Dólar', type: 'FX', region: '💱 FX', category: 'indicator' }
];

async function fetchData(ticker){
  const yUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=10y&events=history`;
  const proxies=[
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
    u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u=>`https://thingproxy.freeboard.io/fetch/${u}`,
  ];
  for(const fn of proxies){
    try{
      const r=await fetch(fn(yUrl),{signal:AbortSignal.timeout(12000)});
      if(!r.ok)continue;
      const j=await r.json();
      const res=j.chart.result[0];
      const q=res.indicators.quote[0];
      const adj=res.indicators.adjclose?.[0]?.adjclose||q.close;
      const ratio=adj.map((a,i)=>(q.close[i]&&a)?a/q.close[i]:1);
      return{
        timestamps:res.timestamp,
        opens:q.open.map((v,i)=>v*ratio[i]),
        highs:q.high.map((v,i)=>v*ratio[i]),
        lows:q.low.map((v,i)=>v*ratio[i]),
        closes:adj,
        vols:q.volume,
      };
    }catch(e){}
  }
  throw new Error('Error fetching');
}

function analyzeAsset(raw){
  const{timestamps,opens,highs,lows,closes,vols}=raw;
  const W=resample(timestamps,opens,highs,lows,closes,vols,'W');
  const M=resample(timestamps,opens,highs,lows,closes,vols,'M');
  
  const m_macd=macd(M.closes);
  const m_s89=stoch(M.highs,M.lows,M.closes,89);
  const m_rsi=rsi(M.closes,14);
  const m_sma10=sma(M.closes,10);
  const mi=M.closes.length-1;
  
  const w_macd=macd(W.closes);
  const w_s89=stoch(W.highs,W.lows,W.closes,89);
  const w_rsi=rsi(W.closes,14);
  const w_sma20=sma(W.closes,20);
  const wi=W.closes.length-1;
  
  const mc={
    macd: m_macd.m[mi]>0 && m_macd.m[mi]>m_macd.sl[mi],
    s89: (m_s89.k[mi]>80&&m_s89.k[mi]>m_s89.d[mi])||m_s89.k[mi]>92,
    rsi: m_rsi[mi]>65,
    precio: m_sma10[mi]&&M.closes[mi]>m_sma10[mi]
  };
  
  const sc={
    macd: w_macd.m[wi]>0&&w_macd.m[wi]>w_macd.sl[wi],
    s89: (w_s89.k[wi]>85&&w_s89.k[wi]>w_s89.d[wi])||w_s89.k[wi]>92,
    rsi: w_rsi[wi]>67,
    precio: w_sma20[wi]&&W.closes[wi]>w_sma20[wi]
  };
  
  const score = Object.values(mc).filter(x=>x).length + Object.values(sc).filter(x=>x).length;
  
  const last52w = closes.slice(-252);
  const current = closes[closes.length-1];
  const min52 = Math.min(...last52w);
  const max52 = Math.max(...last52w);
  const percentile = ((current - min52) / (max52 - min52)) * 100;
  
  return {
    score,
    mensual: mc,
    semanal: sc,
    price: current,
    closes: closes.slice(-60),
    percentile,
    min52,
    max52,
    raw
  };
}

async function runAnalysis(){
  const results = [];
  
  for(const asset of ASSETS){
    try{
      const raw = await fetchData(asset.ticker);
      const analysis = analyzeAsset(raw);
      results.push({
        ...asset,
        ...analysis
      });
    }catch(err){
      results.push({
        ...asset,
        score: 0,
        error: err.message
      });
    }
  }
  
  allData = results;
  
  const allocationAssets = results.filter(a => a.category === 'allocation');
  const indicators = results.filter(a => a.category === 'indicator');
  
  allocationAssets.sort((a,b) => b.score - a.score);
  const top2 = allocationAssets.slice(0, 2);
  
  const rfCount = top2.filter(a => a.type === 'RF').length;
  const rvCount = top2.filter(a => a.type === 'RV').length;
  
  let recommendation;
  if(rvCount === 2){
    recommendation = { type: 'RV', label: 'RENTA VARIABLE', class: 'green', desc: 'Los 2 más fuertes son RV' };
  }else if(rfCount === 2){
    recommendation = { type: 'RF', label: 'RENTA FIJA', class: 'blue', desc: 'Los 2 más fuertes son RF' };
  }else{
    recommendation = { type: 'NEUTRO', label: 'MIXTO', class: 'yellow', desc: '1 RF + 1 RV' };
  }
  
  const gold = indicators.find(i => i.ticker === 'GLD');
  const oil = indicators.find(i => i.ticker === 'USO');
  const hy = indicators.find(i => i.ticker === 'HYG');
  const fx = indicators.find(i => i.ticker === 'EURUSD=X');
  
  renderDashboard(allocationAssets, top2, recommendation, gold, oil, hy, fx);
}

function renderDashboard(allocation, top2, rec, gold, oil, hy, fx){
  const recessionAlert = hy && hy.score <= 3 ? 'red' : hy && hy.score <= 5 ? 'yellow' : 'green';
  const recessionLabel = hy && hy.score <= 3 ? '⚠️ ALTO' : hy && hy.score <= 5 ? '⚡ MODERADO' : '✓ BAJO';
  
  const hedgeDecision = fx && fx.score >= 6 ? 'red' : fx && fx.score >= 4 ? 'yellow' : 'green';
  const hedgeLabel = fx && fx.score >= 6 ? 'SÍ CUBRIR' : fx && fx.score >= 4 ? 'VIGILAR' : 'NO CUBRIR';
  
  // Generar warnings inteligentes
  const warnings = [];
  
  // Warning: Oro muy fuerte
  if(gold && gold.score >= 7) {
    warnings.push({
      type: 'caution',
      icon: '🥇',
      text: '<strong>Oro en máximos:</strong> Mercado buscando refugio. Incertidumbre elevada. Validar posiciones de riesgo.'
    });
  }
  
  // Warning: Divergencia RV fuerte pero HY débil
  if(rec.type === 'RV' && hy && hy.score <= 4) {
    warnings.push({
      type: 'alert',
      icon: '⚠️',
      text: '<strong>Divergencia detectada:</strong> Renta Variable fuerte pero High Yield débil. Señal contradictoria – extrema precaución.'
    });
  }
  
  // Warning: Petróleo muy fuerte
  if(oil && oil.score >= 7) {
    warnings.push({
      type: 'caution',
      icon: '🛢️',
      text: '<strong>Commodities en fuerza:</strong> Petróleo muy fuerte. Posible presión inflacionaria. Vigilar política monetaria.'
    });
  }
  
  // Warning: Todo claro - entorno óptimo
  if(rec.type === 'RV' && hy && hy.score >= 6 && gold && gold.score <= 4) {
    warnings.push({
      type: 'ok',
      icon: '✓',
      text: '<strong>Entorno favorable:</strong> RV fuerte, crédito sano, sin búsqueda de refugio. Condiciones óptimas para posiciones alcistas.'
    });
  }
  
  // Warning: Modo defensivo total
  if(rec.type === 'RF' && gold && gold.score >= 6) {
    warnings.push({
      type: 'alert',
      icon: '🛡️',
      text: '<strong>Modo defensivo total:</strong> RF + Oro fuertes. Mercado en máxima aversión al riesgo. Mantener postura conservadora.'
    });
  }
  
  // Warning: EUR/USD muy fuerte - riesgo FX
  if(fx && fx.score >= 7) {
    warnings.push({
      type: 'alert',
      icon: '💱',
      text: '<strong>Euro muy fuerte vs Dólar:</strong> Impacto negativo en inversiones USD sin cobertura. Implementar hedge inmediato.'
    });
  }
  
  // Warning: Volatilidad en petróleo
  if(oil && oil.score <= 3) {
    warnings.push({
      type: 'caution',
      icon: '📉',
      text: '<strong>Petróleo débil:</strong> Posible desaceleración económica o exceso de oferta. Vigilar demanda global.'
    });
  }
  
  // Warning: HY extremadamente débil - recesión inminente
  if(hy && hy.score <= 2) {
    warnings.push({
      type: 'alert',
      icon: '🚨',
      text: '<strong>ALERTA CRÍTICA:</strong> High Yield colapsando. Estrés severo en mercado de crédito. Recesión posible. Reducir exposición inmediatamente.'
    });
  }
  
  const html = `
    <div class="tab-content active" id="tab-dashboard">
      ${warnings.length > 0 ? `
        <div class="warnings">
          ${warnings.map(w => `
            <div class="warning-item ${w.type}">
              <div class="warning-icon">${w.icon}</div>
              <div class="warning-text">${w.text}</div>
            </div>
          `).join('')}
        </div>
      ` : ''}
      
      <div class="executive-dashboard">
        <div class="decision-card ${rec.class}">
          <div class="decision-icon">📈</div>
          <div class="decision-label">Decisión de Inversión</div>
          <div class="decision-value ${rec.class}">${rec.label}</div>
          <div class="decision-desc">${rec.desc}</div>
        </div>
        
        <div class="decision-card ${recessionAlert}">
          <div class="decision-icon">💳</div>
          <div class="decision-label">Riesgo de Recesión</div>
          <div class="decision-value ${recessionAlert}">${recessionLabel}</div>
          <div class="decision-desc">${hy ? 'HYG Score: ' + hy.score + '/8' : 'Analizando...'}</div>
        </div>
        
        <div class="decision-card ${hedgeDecision}">
          <div class="decision-icon">💱</div>
          <div class="decision-label">Cobertura Cambiaria</div>
          <div class="decision-value ${hedgeDecision}">${hedgeLabel}</div>
          <div class="decision-desc">${fx ? 'EUR/USD Score: ' + fx.score + '/8' : 'Analizando...'}</div>
        </div>
      </div>
      
      <div class="assets-compact">
        ${allocation.map(a => `
          <div class="asset-compact ${top2.includes(a) ? 'selected' : ''}">
            <div class="asset-header-compact">
              <div>
                <div class="asset-ticker-compact">${a.ticker}</div>
                <div style="font-size:9px;color:var(--text2);">${a.region}</div>
              </div>
              <div class="asset-score-compact" style="color:${a.score>=6?'var(--green)':a.score>=4?'var(--yellow)':'var(--text2)'}">${a.score}/8</div>
            </div>
            <div class="asset-conditions-compact">
              <span class="cond-mini ${a.mensual?.macd?'ok':'fail'}">M·MACD</span>
              <span class="cond-mini ${a.mensual?.s89?'ok':'fail'}">M·S89</span>
              <span class="cond-mini ${a.mensual?.rsi?'ok':'fail'}">M·RSI</span>
              <span class="cond-mini ${a.mensual?.precio?'ok':'fail'}">M·P>SMA</span>
              <span class="cond-mini ${a.semanal?.macd?'ok':'fail'}">W·MACD</span>
              <span class="cond-mini ${a.semanal?.s89?'ok':'fail'}">W·S89</span>
              <span class="cond-mini ${a.semanal?.rsi?'ok':'fail'}">W·RSI</span>
              <span class="cond-mini ${a.semanal?.precio?'ok':'fail'}">W·P>SMA</span>
            </div>
          </div>
        `).join('')}
        
        ${[allData.find(a => a.ticker === 'SPY'), gold, oil, hy, fx].filter(Boolean).map(a => `
          <div class="asset-compact">
            <div class="asset-header-compact">
              <div>
                <div class="asset-ticker-compact">${a.ticker.replace('=X','')}</div>
                <div style="font-size:9px;color:var(--text2);">${a.region}</div>
              </div>
              <div class="asset-score-compact" style="color:${a.score>=6?'var(--green)':a.score>=4?'var(--yellow)':'var(--red)'}">${a.score}/8</div>
            </div>
            <div style="font-size:10px;color:var(--text2);margin-top:4px;">
              ${a.type === 'INDEX' ? (a.score>=7 ? '🚀 Mercado fuerte' : a.score>=4 ? 'Neutral' : '📉 Débil') :
                a.type === 'GOLD' && a.score>=7 ? '⚠️ Refugio fuerte' : 
                a.type === 'HY' && a.score<=3 ? '⚠️ Estrés de crédito' :
                a.type === 'FX' && a.score>=6 ? 'Euro fuerte - Cubrir' :
                'Normal'}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
    
    <div class="tab-content" id="tab-params">
      ${renderParameters()}
    </div>
    
    <button class="btn" onclick="runAnalysis()">⟲ ACTUALIZAR</button>
  `;
  
  document.getElementById('content').innerHTML = html;
  
  if(currentTab === 'params') {
    setTimeout(renderCharts, 100);
  }
}

function renderParameters(){
  if(!allData) return '<div class="loading">Cargando datos...</div>';
  
  return `
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Evolución Normalizada (60d)</div>
        <canvas id="evolutionChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Momentum (% cambio 20d)</div>
        <canvas id="momentumChart"></canvas>
      </div>
    </div>
    
    <div class="percentiles-table">
      <div class="chart-title">Análisis 52 Semanas</div>
      <table>
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Precio</th>
            <th>Min 52w</th>
            <th>Max 52w</th>
            <th>Percentil</th>
            <th>Posición</th>
          </tr>
        </thead>
        <tbody>
          ${allData.map(a => `
            <tr>
              <td><strong>${a.ticker.replace('=X','')}</strong></td>
              <td>$${a.price?.toFixed(2) || 'N/A'}</td>
              <td>$${a.min52?.toFixed(2) || 'N/A'}</td>
              <td>$${a.max52?.toFixed(2) || 'N/A'}</td>
              <td>${a.percentile?.toFixed(0) || 'N/A'}%</td>
              <td>
                <div class="percentile-bar">
                  <div class="percentile-fill" style="width:${a.percentile || 0}%"></div>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    
    <div class="chart-card" style="margin-bottom:20px;">
      <div class="chart-title">Matriz de Correlaciones (60 días)</div>
      <div id="correlationMatrix"></div>
    </div>
  `;
}

function renderCharts(){
  if(!allData) return;
  
  const validAssets = allData.filter(a => a.closes && a.closes.length > 0);
  
  // Evolución
  const labels = Array.from({length: 60}, (_, i) => `-${60-i}d`);
  new Chart(document.getElementById('evolutionChart'), {
    type: 'line',
    data: {
      labels,
      datasets: validAssets.slice(0,6).map((a, i) => ({
        label: a.ticker.replace('=X',''),
        data: a.closes.map(c => ((c / a.closes[0]) - 1) * 100),
        borderColor: ['#00ff87', '#3b82f6', '#fbbf24', '#ff3b5c', '#8b5cf6', '#10b981'][i],
        tension: 0.4,
        borderWidth: 2
      }))
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: '#d4dbe8', font: {size: 10} } } },
      scales: {
        y: { ticks: { color: '#5a6478', callback: v => v + '%' }, grid: { color: '#1c2535' } },
        x: { ticks: { color: '#5a6478', maxTicksLimit: 10 }, grid: { color: '#1c2535' } }
      }
    }
  });
  
  // Momentum
  const momentum = validAssets.map(a => {
    const recent = a.closes.slice(-20);
    return recent.length > 0 ? ((recent[recent.length-1] / recent[0]) - 1) * 100 : 0;
  });
  
  new Chart(document.getElementById('momentumChart'), {
    type: 'bar',
    data: {
      labels: validAssets.map(a => a.ticker.replace('=X','')),
      datasets: [{
        label: '% Cambio 20d',
        data: momentum,
        backgroundColor: momentum.map(m => m > 0 ? '#00ff87' : '#ff3b5c')
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        y: { ticks: { color: '#5a6478', callback: v => v + '%' }, grid: { color: '#1c2535' } },
        x: { ticks: { color: '#5a6478', font: {size: 10} }, grid: { color: '#1c2535' } }
      }
    }
  });
  
  // Correlaciones
  const tickers = validAssets.map(a => a.ticker.replace('=X',''));
  const corr = calculateCorrelationMatrix(validAssets);
  
  let corrHTML = '<div style="display:grid;grid-template-columns:60px repeat(' + tickers.length + ',1fr);gap:2px;font-size:9px;">';
  corrHTML += '<div></div>' + tickers.map(t => `<div style="text-align:center;font-weight:600;">${t}</div>`).join('');
  
  tickers.forEach((t1, i) => {
    corrHTML += `<div style="font-weight:600;padding:4px;">${t1}</div>`;
    tickers.forEach((t2, j) => {
      const val = corr[i][j];
      const color = val > 0.7 ? '#00ff87' : val > 0.3 ? '#3b82f6' : val < -0.3 ? '#ff3b5c' : '#5a6478';
      corrHTML += `<div style="background:${color}20;color:${color};text-align:center;padding:4px;border-radius:2px;font-size:9px;">${val.toFixed(2)}</div>`;
    });
  });
  corrHTML += '</div>';
  
  document.getElementById('correlationMatrix').innerHTML = corrHTML;
}

function calculateCorrelationMatrix(assets){
  const n = assets.length;
  const matrix = Array(n).fill(0).map(() => Array(n).fill(0));
  
  for(let i = 0; i < n; i++){
    for(let j = 0; j < n; j++){
      if(i === j) {
        matrix[i][j] = 1;
      } else {
        const returns1 = assets[i].closes.map((c,k) => k > 0 ? (c / assets[i].closes[k-1]) - 1 : 0);
        const returns2 = assets[j].closes.map((c,k) => k > 0 ? (c / assets[j].closes[k-1]) - 1 : 0);
        matrix[i][j] = correlation(returns1, returns2);
      }
    }
  }
  return matrix;
}

function correlation(x, y){
  const n = Math.min(x.length, y.length);
  const meanX = x.reduce((a,b) => a+b, 0) / n;
  const meanY = y.reduce((a,b) => a+b, 0) / n;
  
  let num = 0, denX = 0, denY = 0;
  for(let i = 0; i < n; i++){
    const dx = x[i] - meanX;
    const dy = y[i] - meanY;
    num += dx * dy;
    denX += dx * dx;
    denY += dy * dy;
  }
  
  return denX === 0 || denY === 0 ? 0 : num / Math.sqrt(denX * denY);
}

    setTimeout(renderCharts, 100);
  }
}

});

<script>
let charts = {};

async function fetchFundamentals(ticker) {
  // Una sola petición con todos los módulos necesarios
  const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=defaultKeyStatistics,financialData,summaryDetail,incomeStatementHistory,balanceSheetHistory,cashflowStatementHistory`;
  
  const proxies = [
    u => u, // Directo
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  ];
  
  for (const proxy of proxies) {
    try {
      const proxyUrl = proxy(url);
      console.log(`Intentando: ${proxyUrl.substring(0, 100)}...`);
      
      const r = await fetch(proxyUrl, {
        signal: AbortSignal.timeout(20000),
        headers: {
          'Accept': 'application/json',
          'User-Agent': 'Mozilla/5.0'
        }
      });
      
      if (!r.ok) {
        console.warn(`HTTP ${r.status}`);
        continue;
      }
      
      const text = await r.text();
      const data = JSON.parse(text);
      
      if (data.quoteSummary?.result?.[0]) {
        console.log('✓ Datos obtenidos correctamente');
        return data.quoteSummary.result[0];
      } else if (data.quoteSummary?.error) {
        throw new Error(data.quoteSummary.error.description);
      }
    } catch(e) {
      console.warn(`Error con proxy:`, e.message);
      continue;
    }
  }
  
  throw new Error('No se pudo conectar con Yahoo Finance. Los proxies pueden estar bloqueados o el ticker no existe.');
}

function extractValue(obj) {
  return obj?.raw ?? obj?.fmt ?? obj ?? 'N/A';
}

function createChart(canvasId, config) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  
  // Destruir gráfico anterior si existe
  if (charts[canvasId]) {
    charts[canvasId].destroy();
  }
  
  charts[canvasId] = new Chart(canvas, config);
  return charts[canvasId];
}

async function analyze() {
  const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
  if (!ticker) return;
  
  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  
  document.getElementById('content').innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Analizando ${ticker}...</div>
    </div>
  `;
  
  try {
    const data = await fetchFundamentals(ticker);
    
    if (!data) {
      throw new Error('No se encontraron datos para este ticker');
    }
    
    renderAnalysis(ticker, data);
  } catch(err) {
    document.getElementById('content').innerHTML = `
      <div class="error">
        <strong>Error:</strong> ${err.message}
      </div>
    `;
  } finally {
    btn.disabled = false;
  }
}

function renderAnalysis(ticker, allData) {
  const stats = allData?.defaultKeyStatistics || {};
  const fin = allData?.financialData || {};
  const detail = allData?.summaryDetail || {};
  
  // Extraer métricas
  const metrics = {
    price: extractValue(detail.previousClose || detail.regularMarketPrice),
    marketCap: extractValue(detail.marketCap),
    per: extractValue(stats.trailingPE),
    peg: extractValue(stats.pegRatio),
    priceToBook: extractValue(stats.priceToBook),
    roe: extractValue(fin.returnOnEquity),
    roa: extractValue(fin.returnOnAssets),
    debtToEquity: extractValue(fin.debtToEquity),
    currentRatio: extractValue(fin.currentRatio),
    profitMargin: extractValue(fin.profitMargins),
    revenueGrowth: extractValue(fin.revenueGrowth),
    earningsGrowth: extractValue(fin.earningsGrowth)
  };
  
  // Formatear valores
  const fmt = (v, suffix = '') => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'N/A';
    if (typeof v === 'string') return v;
    return v.toFixed(2) + suffix;
  };
  
  const fmtBillions = (v) => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'N/A';
    if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
    if (v >= 1e9) return '$' + (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(2) + 'M';
    return '$' + v.toFixed(2);
  };
  
  const fmtPct = (v) => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'N/A';
    if (typeof v === 'string') return v;
    return (v * 100).toFixed(2) + '%';
  };
  
  const getClass = (v, threshold, inverse = false) => {
    if (v === 'N/A' || v === null || v === undefined || isNaN(v)) return 'neutral';
    const isGood = inverse ? v < threshold : v > threshold;
    return isGood ? 'positive' : v === threshold ? 'neutral' : 'negative';
  };
  
  // Históricos (si existen)
  const incomeHistory = allData?.incomeStatementHistory?.incomeStatementHistory || [];
  const balanceHistory = allData?.balanceSheetHistory?.balanceSheetStatements || [];
  const cashflowHistory = allData?.cashflowStatementHistory?.cashflowStatements || [];
  
  const hasHistoricalData = incomeHistory.length > 0 || balanceHistory.length > 0 || cashflowHistory.length > 0;
  
  const years = incomeHistory.map(i => {
    try {
      return new Date(i.endDate.fmt).getFullYear();
    } catch(e) {
      return 'N/A';
    }
  }).filter(y => y !== 'N/A').reverse();
  
  const revenues = incomeHistory.map(i => {
    const val = extractValue(i.totalRevenue);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const netIncome = incomeHistory.map(i => {
    const val = extractValue(i.netIncome);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const assets = balanceHistory.map(b => {
    const val = extractValue(b.totalAssets);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const liabilities = balanceHistory.map(b => {
    const val = extractValue(b.totalLiab);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const operatingCashflow = cashflowHistory.map(c => {
    const val = extractValue(c.totalCashFromOperatingActivities);
    return val !== 'N/A' && !isNaN(val) ? val / 1e9 : 0;
  }).reverse();
  
  const capex = cashflowHistory.map(c => {
    const val = extractValue(c.capitalExpenditures || 0);
    return val !== 'N/A' && !isNaN(val) ? Math.abs(val) / 1e9 : 0;
  }).reverse();
  
  const fcf = operatingCashflow.map((ocf, i) => ocf - (capex[i] || 0));
  
  const html = `
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">💰 Precio</div>
        <div class="metric-value neutral">$${fmt(metrics.price)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📊 Market Cap</div>
        <div class="metric-value neutral">${fmtBillions(metrics.marketCap)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📈 PER</div>
        <div class="metric-value ${getClass(metrics.per, 25, true)}">${fmt(metrics.per)}x</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📉 PEG</div>
        <div class="metric-value ${getClass(metrics.peg, 2, true)}">${fmt(metrics.peg)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">🏆 ROE</div>
        <div class="metric-value ${getClass(metrics.roe, 0.15)}">${fmtPct(metrics.roe)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💼 ROA</div>
        <div class="metric-value ${getClass(metrics.roa, 0.05)}">${fmtPct(metrics.roa)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📊 Deuda/Equity</div>
        <div class="metric-value ${getClass(metrics.debtToEquity, 100, true)}">${fmt(metrics.debtToEquity)}%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💧 Current Ratio</div>
        <div class="metric-value ${getClass(metrics.currentRatio, 1)}">${fmt(metrics.currentRatio)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">💹 Profit Margin</div>
        <div class="metric-value ${getClass(metrics.profitMargin, 0.10)}">${fmtPct(metrics.profitMargin)}</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">📈 Revenue Growth</div>
        <div class="metric-value ${getClass(metrics.revenueGrowth, 0)}">${fmtPct(metrics.revenueGrowth)}</div>
      </div>
    </div>
    
    ${hasHistoricalData ? `
    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Ingresos vs Beneficio Neto ($ Billions)</div>
        <canvas id="revenueChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Activos vs Pasivos ($ Billions)</div>
        <canvas id="balanceChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Free Cash Flow ($ Billions)</div>
        <canvas id="fcfChart"></canvas>
      </div>
      
      <div class="chart-card">
        <div class="chart-title">Márgenes y Rentabilidad</div>
        <canvas id="marginsChart"></canvas>
      </div>
    </div>
    ` : '<div style="text-align:center;color:var(--text2);padding:40px;">No hay datos históricos disponibles para este ticker</div>'}
  `;
  
  document.getElementById('content').innerHTML = html;
  
  // Crear gráficos solo si hay datos históricos
  if (!hasHistoricalData) return;
  
  setTimeout(() => {
    // Revenue Chart
    createChart('revenueChart', {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          label: 'Ingresos',
          data: revenues,
          borderColor: '#00ff87',
          backgroundColor: 'rgba(0, 255, 135, 0.1)',
          tension: 0.4
        }, {
          label: 'Beneficio Neto',
          data: netIncome,
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
          x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
        }
      }
    });
    
    // Balance Chart
    createChart('balanceChart', {
      type: 'bar',
      data: {
        labels: years,
        datasets: [{
          label: 'Activos',
          data: assets,
          backgroundColor: '#00ff87'
        }, {
          label: 'Pasivos',
          data: liabilities,
          backgroundColor: '#ff3b5c'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
          x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
        }
      }
    });
    
    // FCF Chart
    createChart('fcfChart', {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          label: 'Operating Cashflow',
          data: operatingCashflow,
          borderColor: '#00ff87',
          fill: false
        }, {
          label: 'CapEx',
          data: capex.map(v => -v),
          borderColor: '#ff3b5c',
          fill: false
        }, {
          label: 'Free Cash Flow',
          data: fcf,
          borderColor: '#fbbf24',
          backgroundColor: 'rgba(251, 191, 36, 0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          y: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } },
          x: { ticks: { color: '#5a6478' }, grid: { color: '#1c2535' } }
        }
      }
    });
    
    // Margins Chart
    createChart('marginsChart', {
      type: 'radar',
      data: {
        labels: ['ROE', 'ROA', 'Profit Margin', 'Revenue Growth', 'Earnings Growth'],
        datasets: [{
          label: ticker,
          data: [
            (metrics.roe || 0) * 100,
            (metrics.roa || 0) * 100,
            (metrics.profitMargin || 0) * 100,
            (metrics.revenueGrowth || 0) * 100,
            (metrics.earningsGrowth || 0) * 100
          ],
          backgroundColor: 'rgba(0, 255, 135, 0.2)',
          borderColor: '#00ff87',
          pointBackgroundColor: '#00ff87'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#d4dbe8' } } },
        scales: {
          r: {
            ticks: { color: '#5a6478', backdropColor: 'transparent' },
            grid: { color: '#1c2535' },
            pointLabels: { color: '#d4dbe8' }
          }
        }
      }
    });
  }, 100);
}

window.addEventListener('load', () => {
  setTimeout(() => analyze(), 500);
});

<script>
/* ══════════════════════════════════════════════════════════

// Contraseña por defecto: ethan2026
const PASS_HASH = 'e1e8769e31fe6dc1fc7f38303b86e94eefe30856354710cefb1471daa17c8ba7';

async function sha256(text) {
  const d = new TextEncoder().encode(text);
  const h = await crypto.subtle.digest('SHA-256', d);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
}

const SK = 'ethan_session', SD = 86400000;
function checkSession() {
  try { const {hash,time} = JSON.parse(localStorage.getItem(SK)); return hash===PASS_HASH && Date.now()-time<SD; } catch(e){return false;}
}
function saveSession() { localStorage.setItem(SK, JSON.stringify({hash:PASS_HASH, time:Date.now()})); }

async function doLogin() {
  const pass = document.getElementById('login-pass').value;
  const hash = await sha256(pass);
  if (hash === PASS_HASH) { saveSession(); showApp(); }
  else {
    document.getElementById('login-error').textContent = 'Contraseña incorrecta';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
    setTimeout(() => document.getElementById('login-error').textContent = '', 3000);
  }
}

function doLogout() { localStorage.removeItem(SK); location.reload(); }

function showApp() {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.add('active');
  setTimeout(() => document.getElementById('login-screen').style.display='none', 700);
}

if (checkSession()) showApp();

const TABS = ['macro','allocation','sectors','sp500','screener','portfolio','fundamental'];
const LABELS = {macro:'ANÁLISIS MACRO',allocation:'ASSET ALLOCATION',sectors:'SECTORES USA',sp500:'SCREENER S&P 500',screener:'SCREENER',portfolio:'CARTERA',fundamental:'ANÁLISIS FUNDAMENTAL'};
const loaded = new Set(['screener']);

function switchTab(id) {
  TABS.forEach(t => {
    document.getElementById('frame-'+t).classList.remove('active');
    document.getElementById('tab-'+t).classList.remove('active');
  });
  const fr = document.getElementById('frame-'+id);
  if (!loaded.has(id)) {
    const src = fr.getAttribute('data-src');
    if (src) { document.getElementById('loader').classList.remove('hidden'); fr.src=src; fr.removeAttribute('data-src'); loaded.add(id); }
  }
  fr.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
  document.getElementById('status-module').textContent = LABELS[id]||id.toUpperCase();
}

document.querySelectorAll('.module-frame').forEach(f => f.addEventListener('load', () => document.getElementById('loader').classList.add('hidden')));

/* Clock + shortcuts */
const ck = () => { const e=document.getElementById('clock'); if(e) e.textContent=new Date().toLocaleString('es-ES'); };
setInterval(ck,1000); ck();
document.addEventListener('keydown', e => {
  if (document.getElementById('login-screen').style.display!=='none') return;
  if (e.altKey && e.key>='1' && e.key<='6') { e.preventDefault(); switchTab(TABS[+e.key-1]); }
});
</script>
