<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETHAN · Screener S&P 500</title>
<style>
:root {
  --bg: #06080c;
  --s1: #0d1117;
  --s2: #161b22;
  --border: #1c2535;
  --green: #00ff87;
  --red: #ff3b5c;
  --yellow: #fbbf24;
  --text: #d4dbe8;
  --text2: #5a6478;
  --text3: #2e3440;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 24px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

.title {
  font-size: 24px;
  font-weight: 600;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
  letter-spacing: 1px;
}

.controls {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn {
  background: var(--green);
  color: var(--bg);
  border: none;
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: opacity 0.2s;
}

.btn:hover { opacity: 0.9; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

.status {
  font-size: 11px;
  color: var(--text2);
  letter-spacing: 1px;
}

.progress-bar {
  height: 4px;
  background: var(--s2);
  margin-bottom: 20px;
  overflow: hidden;
  display: none;
}

.progress-bar.active { display: block; }

.progress-fill {
  height: 100%;
  background: var(--green);
  transition: width 0.3s;
}

.filters {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}

.filter label {
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.filter select, .filter input {
  background: var(--s1);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  font-family: inherit;
  font-size: 11px;
}

.results-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.results-table thead {
  background: var(--s2);
  position: sticky;
  top: 0;
  z-index: 10;
}

.results-table th {
  padding: 10px 12px;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
}

.results-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
}

.results-table tr:hover {
  background: var(--s1);
}

.ticker-cell {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1px;
}

.score-cell {
  font-weight: 700;
  font-size: 16px;
}

.score-green { color: var(--green); }
.score-yellow { color: var(--yellow); }
.score-gray { color: var(--text2); }

.estado-listo { color: var(--green); }
.estado-espera { color: var(--yellow); }
.estado-cerca { color: var(--text2); }

.sector-cell {
  font-size: 10px;
  opacity: 0.7;
}

.sector-strong {
  color: var(--green);
  opacity: 1;
  font-weight: 600;
}

.btn-add {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text2);
  padding: 4px 10px;
  font-size: 10px;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-add:hover {
  border-color: var(--green);
  color: var(--green);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text2);
}

.spinner {
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  display: inline-block;
  margin-right: 10px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title">🔍 SCREENER S&P 500</div>
    <div class="subtitle">Escaneo automático de oportunidades</div>
  </div>
  <div class="controls">
    <span class="status" id="status">Listo</span>
    <button class="btn" onclick="startScan()" id="scanBtn">ESCANEAR</button>
  </div>
</div>

<div class="progress-bar" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="filters">
  <div class="filter">
    <label>Score Mínimo:</label>
    <select id="filterScore" onchange="renderResults()">
      <option value="0">Todos</option>
      <option value="6">≥ 6</option>
      <option value="7" selected>≥ 7</option>
      <option value="8">≥ 8</option>
      <option value="9">≥ 9</option>
      <option value="10">= 10</option>
    </select>
  </div>
  <div class="filter">
    <label>Estado:</label>
    <select id="filterEstado" onchange="renderResults()">
      <option value="all">Todos</option>
      <option value="ready">Solo LISTO</option>
      <option value="diario">Espera Diario</option>
      <option value="close">Cerca</option>
    </select>
  </div>
  <div class="filter">
    <label>Sector:</label>
    <select id="filterSector" onchange="renderResults()">
      <option value="all">Todos</option>
      <option value="XLK">Technology</option>
      <option value="XLF">Financials</option>
      <option value="XLV">Health Care</option>
      <option value="XLE">Energy</option>
      <option value="XLY">Consumer Discr.</option>
      <option value="XLP">Consumer Staples</option>

      <option value="XLU">Utilities</option>
      <option value="XLRE">Real Estate</option>
      <option value="XLC">Communication</option>

  </div>
</div>

<div id="resultsContainer">
  <div class="empty-state">
    <div>Haz clic en <strong>ESCANEAR</strong> para buscar oportunidades en el S&P 500</div>
  </div>
</div>

function ema(arr, p) {
  const k=2/(p+1), out=new Array(arr.length).fill(null);
  let s=arr.findIndex(v=>v!=null&&!isNaN(v));
  if (s<0) return out;
  out[s]=arr[s];
  for (let i=s+1;i<arr.length;i++) {
    const v=(arr[i]!=null&&!isNaN(arr[i]))?arr[i]:out[i-1];
    out[i]=v*k+out[i-1]*(1-k);
  }
  return out;
}

function macd(closes){const ef=ema(closes,12),es=ema(closes,26);const m=ef.map((v,i)=>(v!=null&&es[i]!=null)?v-es[i]:null);const sl=ema(m.map(v=>v??0),9);return{m,sl};}
function rsi(closes,p=14){const out=new Array(closes.length).fill(null);if(closes.length<p+1)return out;let g=0,l=0;for(let i=1;i<=p;i++){const d=closes[i]-closes[i-1];d>0?g+=d:l-=d;}let ag=g/p,al=l/p;out[p]=al===0?100:100-(100/(1+ag/al));for(let i=p+1;i<closes.length;i++){const d=closes[i]-closes[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;out[i]=al===0?100:100-(100/(1+ag/al));}return out;}
function stoch(highs,lows,closes,p){const rawK=closes.map((c,i)=>{if(i<p-1)return null;const hh=Math.max(...highs.slice(i-p+1,i+1));const ll=Math.min(...lows.slice(i-p+1,i+1));return hh===ll?50:(c-ll)/(hh-ll)*100;});const k=ema(rawK,3);const d=ema(k.map(v=>v??0),3);return{k,d};}
function resample(ts,opens,highs,lows,closes,vols,freq){const groups={};ts.forEach((t,i)=>{const dd=new Date(t*1000);let key;if(freq==='W'){const day=dd.getDay();const diff=dd.getDate()-day+(day===0?-6:1);const mo=new Date(+dd);mo.setDate(diff);key=mo.toISOString().slice(0,10);}else{key=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}`;}if(!groups[key]){groups[key]={o:opens[i],h:highs[i],l:lows[i],c:closes[i],v:vols[i]};}else{groups[key].h=Math.max(groups[key].h,highs[i]);groups[key].l=Math.min(groups[key].l,lows[i]);groups[key].c=closes[i];groups[key].v+=vols[i];}});const keys=Object.keys(groups).sort();return{dates:keys,opens:keys.map(k=>groups[k].o),highs:keys.map(k=>groups[k].h),lows:keys.map(k=>groups[k].l),closes:keys.map(k=>groups[k].c),vols:keys.map(k=>groups[k].v)};}

async function fetchData(ticker){
  const yUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=10y&events=history`;
  const proxies=[
    u=>`https://soft-field-156f.miguel-gomez-anton.workers.dev/?url=${encodeURIComponent(u)}`,
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
    u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u=>`https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
    u=>`https://cors-proxy.fringe.zone/${u}`,
  ];
  let lastErr;
  for(const fn of proxies){
    try{
      const r=await fetch(fn(yUrl),{signal:AbortSignal.timeout(12000)});
      if(!r.ok)throw new Error(`HTTP ${r.status}`);
      const j=JSON.parse(await r.text());
      if(j.chart?.error)throw new Error(j.chart.error.description);
      const res=j.chart.result[0];
      const q=res.indicators.quote[0];
      const adj=res.indicators.adjclose?.[0]?.adjclose||q.close;
      const ratio=adj.map((a,i)=>(q.close[i]&&a)?a/q.close[i]:1);
      return{
        timestamps:res.timestamp,
        opens:q.open.map((v,i)=>v*ratio[i]),
        highs:q.high.map((v,i)=>v*ratio[i]),
        lows:q.low.map((v,i)=>v*ratio[i]),
        closes:adj,
        vols:q.volume,
      };
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('Sin conexión');
}

function analyzeQuick(raw){
  const{timestamps,opens,highs,lows,closes,vols}=raw;
  const n=closes.length;
  const W=resample(timestamps,opens,highs,lows,closes,vols,'W');
  const M=resample(timestamps,opens,highs,lows,closes,vols,'M');
  
  const m_macd=macd(M.closes);
  const m_s89=stoch(M.highs,M.lows,M.closes,89);
  const m_s8=stoch(M.highs,M.lows,M.closes,8);
  const m_rsi=rsi(M.closes,14);
  const m_ema10=ema(M.closes,10);
  const mi=M.closes.length-1;
  
  const w_macd=macd(W.closes);
  const w_s89=stoch(W.highs,W.lows,W.closes,89);
  const w_rsi=rsi(W.closes,14);
  const w_ema20=ema(W.closes,20);
  const wi=W.closes.length-1;
  
  const d_macd=macd(closes);
  const d_rsi=rsi(closes,14);
  const di=n-1;
  
  let score=0;
  const mc_ok=[
    m_macd.m[mi]>0&&m_macd.m[mi]>m_macd.sl[mi],
    (m_s89.k[mi]>80&&m_s89.k[mi]>m_s89.d[mi])||m_s89.k[mi]>92,
    m_rsi[mi]>65,
    m_s8.k[mi]>78,
    m_ema10[mi]&&M.closes[mi]>m_ema10[mi]
  ];
  const sc_ok=[
    w_macd.m[wi]>0&&w_macd.m[wi]>w_macd.sl[wi],
    (w_s89.k[wi]>85&&w_s89.k[wi]>w_s89.d[wi])||w_s89.k[wi]>92,
    w_rsi[wi]>67,
    w_ema20[wi]&&W.closes[wi]>w_ema20[wi]
  ];
  
  score=mc_ok.filter(x=>x).length+sc_ok.filter(x=>x).length;
  
  const mensualOk=mc_ok.every(x=>x);
  const semanalOk=sc_ok.every(x=>x);
  const dailyReady=d_macd.m[di]>d_macd.sl[di]&&d_macd.m[di-1]<=d_macd.sl[di-1]&&d_rsi[di]>57&&d_macd.m[di]>0;
  
  let estado='watching';
  if(mensualOk&&semanalOk&&dailyReady)estado='ready';
  else if(mensualOk&&semanalOk)estado='diario';
  else if(score>=7)estado='close';
  
  return{score,estado,price:closes[di]};
}

async function startScan(){
  if(scanning)return;
  scanning=true;
  scanResults=[];
  
  const btn=document.getElementById('scanBtn');
  const status=document.getElementById('status');
  const progress=document.getElementById('progressBar');
  const fill=document.getElementById('progressFill');
  
  btn.disabled=true;
  progress.classList.add('active');
  fill.style.width='0%';
  
  document.getElementById('resultsContainer').innerHTML=`
    <div class="empty-state">
      <div class="spinner"></div>
      <div>Escaneando S&P 500...</div>
    </div>
  `;
  
  for(let i=0;i<SP500.length;i++){
    const ticker=SP500[i];
    const pct=((i+1)/SP500.length*100).toFixed(1);
    
    fill.style.width=pct+'%';
    status.textContent=`${ticker} (${i+1}/${SP500.length})`;
    
    try{
      const raw=await fetchData(ticker);
      const result=analyzeQuick(raw);
      result.ticker=ticker;
      result.sector=SECTOR_MAP[ticker]||null;
      scanResults.push(result);
      
      if(result.score>=7){
        renderResults();
      }
    }catch(err){
      // Ignorar errores y continuar
    }
  }
  
  scanning=false;
  btn.disabled=false;
  progress.classList.remove('active');
  status.textContent=`Completado: ${scanResults.length} valores escaneados`;
  renderResults();
}

function renderResults(){
  const minScore=parseInt(document.getElementById('filterScore').value);
  const filterEstado=document.getElementById('filterEstado').value;
  const filterSector=document.getElementById('filterSector').value;
  
  let filtered=scanResults.filter(r=>{
    if(r.score<minScore)return false;
    if(filterEstado!=='all'&&r.estado!==filterEstado)return false;
    if(filterSector!=='all'&&r.sector!==filterSector)return false;
    return true;
  });
  
  filtered.sort((a,b)=>b.score-a.score);
  
  if(filtered.length===0){
    document.getElementById('resultsContainer').innerHTML=`
      <div class="empty-state">
        <div>No se encontraron valores que cumplan los filtros</div>
      </div>
    `;
    return;
  }
  
  const rows=filtered.map(r=>{
    const scoreClass=r.score>=9?'score-green':r.score>=7?'score-yellow':'score-gray';
    const estadoClass=r.estado==='ready'?'estado-listo':r.estado==='diario'?'estado-espera':'estado-cerca';
    const estadoText={'ready':'🟢 LISTO','diario':'⏳ ESPERA DIARIO','close':'🔶 CERCA','watching':'👁 VIGILANDO'}[r.estado];
    
    return`
      <tr>
        <td class="ticker-cell">${r.ticker}</td>
        <td class="sector-cell">${r.sector?SECTOR_NAMES[r.sector]:'-'}</td>
        <td class="score-cell ${scoreClass}">${r.score}/10</td>
        <td class="${estadoClass}">${estadoText}</td>
        <td>${r.price?r.price.toFixed(2):'-'}</td>
        <td><button class="btn-add" onclick="addToWatchlist('${r.ticker}')">+ Watchlist</button></td>
      </tr>
    `;
  }).join('');
  
  document.getElementById('resultsContainer').innerHTML=`
    <table class="results-table">
      <thead>
        <tr>
          <th>TICKER</th>
          <th>SECTOR</th>
          <th>SCORE</th>
          <th>ESTADO</th>
          <th>PRECIO</th>
          <th>ACCIÓN</th>
        </tr>
      </thead>
      <tbody>
        ${rows}
      </tbody>
    </table>
  `;
}

function addToWatchlist(ticker){
  alert(`${ticker} añadido al watchlist (función pendiente de implementar)`);
}

// Auto-escanear al cargar
window.addEventListener('load',()=>{
  setTimeout(startScan,1000);
});
