<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis Fundamental — ETHAN Mercados</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%);
    min-height: 100vh;
    padding: 30px 20px;
}
.container { max-width: 1400px; margin: 0 auto; }

/* ── SEARCH BAR ── */
.search-section {
    background: white;
    border-radius: 20px;
    padding: 35px 40px;
    margin-bottom: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
}
.search-title {
    font-size: 2em;
    font-weight: 800;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
}
.search-sub { color: #888; font-size: 1em; margin-bottom: 25px; }
.search-row {
    display: flex;
    gap: 12px;
    max-width: 600px;
    margin: 0 auto;
    align-items: center;
}
.search-input {
    flex: 1;
    padding: 16px 24px;
    font-size: 1.2em;
    font-weight: 700;
    border: 3px solid #e0e0e0;
    border-radius: 14px;
    outline: none;
    text-transform: uppercase;
    transition: border-color 0.3s;
    letter-spacing: 1px;
}
.search-input:focus { border-color: #1e3a5f; }
.search-input::placeholder { text-transform: none; font-weight: 400; color: #bbb; letter-spacing: 0; }
.search-btn {
    padding: 16px 36px;
    font-size: 1.1em;
    font-weight: 700;
    background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%);
    color: white;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    white-space: nowrap;
}
.search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30,58,95,0.4); }
.search-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.search-examples { margin-top: 15px; color: #999; font-size: 0.9em; }
.search-examples span {
    display: inline-block;
    background: #f0f0f0;
    padding: 4px 12px;
    border-radius: 6px;
    margin: 3px;
    cursor: pointer;
    transition: background 0.2s;
    font-weight: 600;
    color: #555;
}
.search-examples span:hover { background: #e0e0e0; }

/* ── LOADING ── */
.loading-overlay {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: white;
}
.loading-overlay.active { display: block; }
.spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top: 4px solid white;
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { font-size: 1.3em; font-weight: 600; }

/* ── ERROR ── */
.error-box {
    display: none;
    background: #fef2f2;
    border: 2px solid #dc2626;
    border-radius: 15px;
    padding: 25px 30px;
    margin-bottom: 25px;
    color: #991b1b;
    font-weight: 600;
    font-size: 1.05em;
    text-align: center;
}
.error-box.active { display: block; }

/* ── RESULTS (same as Altria template) ── */
#results { display: none; }
#results.active { display: block; }

.company-card { background: white; border-radius: 25px; padding: 40px; margin-bottom: 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.company-name { font-size: 2.5em; font-weight: 800; background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 8px; }
.company-sub { color: #888; font-size: 1.1em; margin-bottom: 25px; }
.info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 20px; }
.info-item { background: #f8f9fa; padding: 15px 20px; border-radius: 12px; border-left: 4px solid #1e3a5f; }
.info-label { color: #666; font-size: 0.85em; margin-bottom: 4px; }
.info-value { color: #1e3a5f; font-size: 1.25em; font-weight: 800; }
.info-value.highlight { color: #2d6a4f; }
.highlight-banner { background: linear-gradient(135deg, #2d6a4f 0%, #1e3a5f 100%); color: white; border-radius: 15px; padding: 20px 30px; text-align: center; font-size: 1.2em; font-weight: 700; }

.rankings { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 30px; margin-bottom: 35px; }
.ranking-card { background: white; border-radius: 25px; padding: 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.ranking-icon { font-size: 3em; text-align: center; margin-bottom: 10px; }
.ranking-title { font-size: 1.5em; font-weight: 800; color: #333; text-align: center; margin-bottom: 20px; }
.score-circle { width: 180px; height: 180px; margin: 20px auto; border-radius: 50%; background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; box-shadow: 0 15px 40px rgba(30,58,95,0.4); position: relative; }
.score-circle::before { content: ''; position: absolute; inset: 8px; border-radius: 50%; background: linear-gradient(135deg, #2d6a4f 0%, #1e3a5f 100%); z-index: 0; }
.score-content { position: relative; z-index: 1; text-align: center; }
.score-number { font-size: 3em; font-weight: 800; line-height: 1; }
.score-max { font-size: 1.2em; opacity: 0.9; margin-top: 4px; }
.score-stars { font-size: 1.4em; margin-top: 8px; }
.score-label-box { text-align: center; font-size: 1.2em; font-weight: 700; color: white; margin: 15px 0; padding: 12px 20px; background: linear-gradient(135deg, #1e3a5f 0%, #2d6a4f 100%); border-radius: 12px; }
.metrics { background: #f8f9fa; border-radius: 12px; padding: 18px; }
.metric { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e9ecef; font-size: 1em; }
.metric:last-child { border-bottom: none; }
.metric-label { font-weight: 600; color: #555; }
.metric-value { font-weight: 800; color: #1e3a5f; }

.financials-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px; margin-bottom: 35px; }
.fin-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
.fin-title { font-size: 1.3em; font-weight: 800; color: #1e3a5f; margin-bottom: 20px; border-bottom: 3px solid #1e3a5f; padding-bottom: 10px; }
.fin-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.fin-row:last-child { border-bottom: none; }
.fin-label { color: #555; font-weight: 600; }
.fin-value { font-weight: 800; color: #1e3a5f; }
.fin-value.green { color: #2d6a4f; }
.fin-value.red { color: #dc2626; }
.fin-value.orange { color: #f59e0b; }

.analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 35px; }
.analysis-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
.analysis-title { font-size: 1.4em; font-weight: 800; margin-bottom: 20px; }
.analysis-title.green { color: #2d6a4f; }
.analysis-title.red { color: #dc2626; }
.analysis-item { padding: 12px 15px; margin: 8px 0; border-radius: 10px; font-weight: 600; font-size: 1em; line-height: 1.4; }
.analysis-item.strength { background: #f0fdf4; border-left: 4px solid #2d6a4f; color: #166534; }
.analysis-item.weakness { background: #fef2f2; border-left: 4px solid #dc2626; color: #991b1b; }

.conclusion { background: white; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); margin-bottom: 35px; }
.conclusion h3 { color: #1e3a5f; font-size: 2em; margin-bottom: 20px; }
.recommendation { font-size: 1.8em; font-weight: 900; margin: 20px 0; padding: 20px; border-radius: 15px; }
.rec-green { color: #2d6a4f; background: #f0fdf4; }
.rec-yellow { color: #92400e; background: #fffbeb; }
.rec-red { color: #991b1b; background: #fef2f2; }
.investor-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 25px; }
.investor-item { padding: 15px; border-radius: 12px; font-weight: 700; font-size: 1em; }
.investor-item.yes { background: #f0fdf4; color: #166534; border: 2px solid #2d6a4f; }
.investor-item.no { background: #fef2f2; color: #991b1b; border: 2px solid #dc2626; }
.investor-item.maybe { background: #fffbeb; color: #92400e; border: 2px solid #f59e0b; }

.footer { text-align: center; color: white; margin-top: 30px; padding: 25px; background: rgba(255,255,255,0.1); border-radius: 15px; }

@media (max-width: 768px) {
    .rankings, .financials-grid, .analysis-grid { grid-template-columns: 1fr; }
    .investor-grid { grid-template-columns: 1fr; }
    .search-row { flex-direction: column; }
    .company-name { font-size: 1.8em; }
}
</style>
</head>
<body>
<div class="container">

    <!-- SEARCH -->
    <div class="search-section">
        <div class="search-title">📊 Análisis Fundamental</div>
        <div class="search-sub">Sistema de 3 Rankings · Introduce un ticker para analizar</div>
        <div class="search-row">
            <input type="text" class="search-input" id="tickerInput" placeholder="Ej: AAPL, MSFT, MO..." maxlength="10"
                   onkeydown="if(event.key==='Enter') runAnalysis()">
            <button class="search-btn" id="searchBtn" onclick="runAnalysis()">🔍 Analizar</button>
        </div>
        <div class="search-examples">
            Ejemplos:
            <span onclick="quickSearch('AAPL')">AAPL</span>
            <span onclick="quickSearch('MSFT')">MSFT</span>
            <span onclick="quickSearch('GOOGL')">GOOGL</span>
            <span onclick="quickSearch('MO')">MO</span>
            <span onclick="quickSearch('JNJ')">JNJ</span>
            <span onclick="quickSearch('NVDA')">NVDA</span>
            <span onclick="quickSearch('TPR')">TPR</span>
            <span onclick="quickSearch('KO')">KO</span>
        </div>
        <div id="apiStatus" style="margin-top:15px;font-size:0.85em;color:#999;"></div>
    </div>

    <!-- LOADING -->
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text" id="loadingText">Obteniendo datos financieros...</div>
    </div>

    <!-- ERROR -->
    <div class="error-box" id="errorBox"></div>

    <!-- RESULTS -->
    <div id="results"></div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ETHAN MERCADOS — ANÁLISIS FUNDAMENTAL
   Sistema de 3 Rankings con Yahoo Finance API
   ═══════════════════════════════════════════════════════════ */

function quickSearch(ticker) {
    document.getElementById('tickerInput').value = ticker;
    runAnalysis();
}

// ── FMP API KEY ──
// Registra tu API key gratuita en https://site.financialmodelingprep.com/
// y pégala aquí para datos ilimitados (250 llamadas/día gratis):
let FMP_KEY = localStorage.getItem('fmp_api_key') || '';

// ── CONFIG BOX (mostrar si no hay key) ──
function showApiKeyPrompt() {
    const existing = document.getElementById('apiKeyBox');
    if (existing) existing.remove();
    
    const box = document.createElement('div');
    box.id = 'apiKeyBox';
    box.style.cssText = 'background:#fffbeb;border:2px solid #f59e0b;border-radius:15px;padding:25px 30px;margin-bottom:25px;text-align:center;';
    box.innerHTML = `
        <div style="font-weight:800;color:#92400e;font-size:1.1em;margin-bottom:10px;">🔑 API Key necesaria</div>
        <div style="color:#92400e;margin-bottom:15px;font-size:0.95em;">
            Para obtener datos financieros, necesitas una API key gratuita de Financial Modeling Prep.<br>
            <a href="https://site.financialmodelingprep.com/register" target="_blank" style="color:#1e3a5f;font-weight:700;">→ Registrarse gratis aquí (1 minuto)</a> · 250 llamadas/día
        </div>
        <div style="display:flex;gap:10px;max-width:500px;margin:0 auto;">
            <input type="text" id="fmpKeyInput" placeholder="Pega tu API key aquí..." 
                   style="flex:1;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:1em;outline:none;">
            <button onclick="saveApiKey()" style="padding:12px 24px;background:linear-gradient(135deg,#1e3a5f,#2d6a4f);color:white;border:none;border-radius:10px;font-weight:700;cursor:pointer;">Guardar</button>
        </div>
        <div style="color:#999;font-size:0.8em;margin-top:8px;">Se guarda en tu navegador. Solo tienes que hacerlo una vez.</div>
    `;
    document.querySelector('.search-section').after(box);
}

function saveApiKey() {
    const key = document.getElementById('fmpKeyInput').value.trim();
    if (key) {
        FMP_KEY = key;
        localStorage.setItem('fmp_api_key', key);
        document.getElementById('apiKeyBox').remove();
        // Retry if there was a ticker
        const ticker = document.getElementById('tickerInput').value.trim();
        if (ticker) runAnalysis();
    }
}

// ── FETCH DATA FROM FMP ──
async function fetchYahooData(ticker) {
    if (!FMP_KEY) {
        showApiKeyPrompt();
        throw new Error('Necesitas una API key. Regístrate gratis en Financial Modeling Prep (1 minuto).');
    }

    const base = 'https://financialmodelingprep.com/stable';
    const legacyBase = 'https://financialmodelingprep.com/api/v3';
    
    // First test: check if API key works with profile call
    let profileResp;
    try {
        // Try stable endpoint first, then legacy
        profileResp = await fetch(`${base}/profile?symbol=${ticker}&apikey=${FMP_KEY}`);
        if (!profileResp.ok) {
            profileResp = await fetch(`${legacyBase}/profile/${ticker}?apikey=${FMP_KEY}`);
        }
    } catch(e) {
        throw new Error('No se puede conectar con Financial Modeling Prep. Revisa tu conexión a internet.');
    }
    
    let profileData;
    try {
        profileData = await profileResp.json();
    } catch(e) {
        throw new Error('Respuesta inválida del servidor. Tu API key puede ser incorrecta.');
    }
    
    // Check for API errors
    if (profileData['Error Message']) {
        throw new Error('API Key inválida. Ve a financialmodelingprep.com/dashboard y copia la key correcta.');
    }
    if (profileData.message && profileData.message.includes('Limit')) {
        throw new Error('Has alcanzado el límite diario de 250 llamadas. Inténtalo mañana.');
    }
    if (!Array.isArray(profileData) || profileData.length === 0) {
        throw new Error(`Ticker "${ticker}" no encontrado. Verifica que sea correcto (ej: AAPL, MSFT, GOOGL).`);
    }

    const profile = profileData[0];
    
    // Fetch remaining endpoints — try stable routes first, legacy as fallback
    const endpoints = {
        ratios: [`${base}/ratios-ttm?symbol=${ticker}&apikey=${FMP_KEY}`, `${legacyBase}/ratios-ttm/${ticker}?apikey=${FMP_KEY}`],
        keyMetrics: [`${base}/key-metrics-ttm?symbol=${ticker}&apikey=${FMP_KEY}`, `${legacyBase}/key-metrics-ttm/${ticker}?apikey=${FMP_KEY}`],
        income: [`${base}/income-statement?symbol=${ticker}&limit=2&apikey=${FMP_KEY}`, `${legacyBase}/income-statement/${ticker}?limit=2&apikey=${FMP_KEY}`],
        balance: [`${base}/balance-sheet-statement?symbol=${ticker}&limit=1&apikey=${FMP_KEY}`, `${legacyBase}/balance-sheet-statement/${ticker}?limit=1&apikey=${FMP_KEY}`],
        cashflow: [`${base}/cash-flow-statement?symbol=${ticker}&limit=1&apikey=${FMP_KEY}`, `${legacyBase}/cash-flow-statement/${ticker}?limit=1&apikey=${FMP_KEY}`],
        rating: [`${base}/rating?symbol=${ticker}&apikey=${FMP_KEY}`, `${legacyBase}/rating/${ticker}?apikey=${FMP_KEY}`],
        ev: [`${base}/enterprise-values?symbol=${ticker}&limit=1&apikey=${FMP_KEY}`, `${legacyBase}/enterprise-values/${ticker}?limit=1&apikey=${FMP_KEY}`],
        surprises: [`${base}/earnings-surprises?symbol=${ticker}&limit=4&apikey=${FMP_KEY}`, `${legacyBase}/earnings-surprises/${ticker}?limit=4&apikey=${FMP_KEY}`]
    };

    const fetched = {};
    const fetchSafe = async (key, urls) => {
        for (const url of urls) {
            try {
                const r = await fetch(url);
                const j = await r.json();
                if (Array.isArray(j) && j.length > 0 && !j[0]?.['Error Message']) {
                    fetched[key] = j;
                    return;
                } else if (j && !Array.isArray(j) && !j['Error Message'] && !j.message) {
                    fetched[key] = [j];
                    return;
                }
            } catch(e) { continue; }
        }
        fetched[key] = [];
    };

    await Promise.all(Object.entries(endpoints).map(([k, urls]) => fetchSafe(k, urls)));

    const ratios = fetched.ratios?.[0] || {};
    const km = fetched.keyMetrics?.[0] || {};
    const income = fetched.income || [];
    const balance = fetched.balance?.[0] || {};
    const cf = fetched.cashflow?.[0] || {};
    const rating = fetched.rating?.[0] || {};
    const ev = fetched.ev?.[0] || {};
    const surprises = fetched.surprises || [];

    return buildFromFMP(profile, ratios, km, income, balance, cf, {}, rating, ev, {}, surprises);
}

function buildFromFMP(p, ratios, km, income, balance, cf, est, rating, ev, rec, surprises) {
    // Fake the Yahoo-like structure so extractData works
    const inc0 = income[0] || {};
    const inc1 = income[1] || {};
    
    // Safe number helper
    const n = (v) => (v !== undefined && v !== null && !isNaN(v)) ? v : null;

    // Revenue growth
    const revGrowth = (n(inc0.revenue) && n(inc1.revenue) && inc1.revenue !== 0) 
        ? ((inc0.revenue - inc1.revenue) / Math.abs(inc1.revenue)) * 100 : null;
    
    // EPS growth
    const epsGrowth = (n(inc0.epsdiluted) && n(inc1.epsdiluted) && inc1.epsdiluted !== 0)
        ? ((inc0.epsdiluted - inc1.epsdiluted) / Math.abs(inc1.epsdiluted)) * 100 : null;

    // Earnings beats
    let earningsBeats = 0;
    if (Array.isArray(surprises)) {
        surprises.forEach(s => { if (n(s.actualEarningResult) !== null && n(s.estimatedEarning) !== null && s.actualEarningResult > s.estimatedEarning) earningsBeats++; });
    }

    // Cash calculation
    const totalCash = n(balance.cashAndCashEquivalents) !== null 
        ? (balance.cashAndCashEquivalents || 0) + (balance.shortTermInvestments || 0) 
        : null;

    // EBITDA calculation  
    const ebitda = n(inc0.ebitda) || (n(inc0.operatingIncome) && n(inc0.depreciationAndAmortization) 
        ? inc0.operatingIncome + inc0.depreciationAndAmortization : null);

    // PE calculation
    const pe = n(ratios.peRatioTTM) || (n(p.price) && n(inc0.epsdiluted) && inc0.epsdiluted > 0 ? p.price / inc0.epsdiluted : null);

    // Build the result object matching what extractData expects
    const result = {
        financialData: {
            currentPrice: { raw: n(p.price) },
            totalRevenue: { raw: n(inc0.revenue) },
            ebitda: { raw: ebitda },
            freeCashflow: { raw: n(cf.freeCashFlow) },
            operatingCashflow: { raw: n(cf.operatingCashFlow) },
            totalDebt: { raw: n(balance.totalDebt) },
            totalCash: { raw: totalCash },
            debtToEquity: { raw: n(ratios.debtEquityRatioTTM) !== null ? ratios.debtEquityRatioTTM * 100 : null },
            currentRatio: { raw: n(ratios.currentRatioTTM) },
            grossMargins: { raw: n(ratios.grossProfitMarginTTM) },
            operatingMargins: { raw: n(ratios.operatingProfitMarginTTM) },
            profitMargins: { raw: n(ratios.netProfitMarginTTM) },
            returnOnEquity: { raw: n(ratios.returnOnEquityTTM) },
            returnOnAssets: { raw: n(ratios.returnOnAssetsTTM) },
            revenueGrowth: { raw: revGrowth !== null ? revGrowth / 100 : null },
            earningsGrowth: { raw: epsGrowth !== null ? epsGrowth / 100 : null },
            targetMeanPrice: { raw: n(p.dcf) },
            targetHighPrice: { raw: null },
            targetLowPrice: { raw: null }
        },
        defaultKeyStatistics: {
            trailingPE: { raw: pe },
            forwardPE: { raw: n(km.peRatioTTM) || n(ratios.priceEarningsRatioTTM) },
            pegRatio: { raw: n(ratios.priceEarningsToGrowthRatioTTM) || n(km.pegRatioTTM) },
            enterpriseToEbitda: { raw: n(km.enterpriseValueOverEBITDATTM) },
            enterpriseToRevenue: { raw: n(km.evToSalesTTM) },
            enterpriseValue: { raw: n(km.enterpriseValueTTM) || n(ev.enterpriseValue) },
            priceToBook: { raw: n(ratios.priceToBookRatioTTM) || n(km.pbRatioTTM) },
            trailingEps: { raw: n(inc0.epsdiluted) },
            forwardEps: { raw: n(est.estimatedEpsAvg) },
            beta: { raw: n(p.beta) }
        },
        price: {
            regularMarketPrice: { raw: n(p.price) },
            marketCap: { raw: n(p.mktCap) },
            longName: p.companyName || '',
            shortName: p.companyName || '',
            exchangeName: p.exchangeShortName || p.exchange || '',
            symbol: p.symbol || ''
        },
        summaryDetail: {
            trailingPE: { raw: pe },
            forwardPE: { raw: n(km.peRatioTTM) },
            dividendYield: { raw: n(ratios.dividendYieldTTM) || (n(p.lastDiv) && n(p.price) ? p.lastDiv / p.price : 0) },
            dividendRate: { raw: n(p.lastDiv) || 0 },
            payoutRatio: { raw: n(ratios.payoutRatioTTM) },
            fiftyTwoWeekHigh: { raw: p.range ? parseFloat(p.range.split('-')[1]) : null },
            fiftyTwoWeekLow: { raw: p.range ? parseFloat(p.range.split('-')[0]) : null },
            trailingEPS: { raw: n(inc0.epsdiluted) },
            beta: { raw: n(p.beta) }
        },
        summaryProfile: {
            sector: p.sector || '',
            industry: p.industry || '',
            country: p.country || '',
            fullTimeEmployees: p.fullTimeEmployees || 0
        },
        recommendationTrend: {
            trend: [{
                strongBuy: 0, buy: 0, hold: 0, sell: 0, strongSell: 0
            }]
        },
        earningsTrend: { trend: [] },
        earningsHistory: {
            history: Array.isArray(surprises) ? surprises.map(s => ({
                epsActual: { raw: n(s.actualEarningResult) },
                surprisePercent: { raw: n(s.actualEarningResult) !== null && n(s.estimatedEarning) !== null && s.actualEarningResult > s.estimatedEarning 
                    ? ((s.actualEarningResult - s.estimatedEarning) / Math.abs(s.estimatedEarning || 1)) * 100 : -1 }
            })) : []
        }
    };

    return result;
}

// ── EXTRACT DATA ──
function extractData(raw) {
    const fd = raw.financialData || {};
    const ks = raw.defaultKeyStatistics || {};
    const pr = raw.price || {};
    const sd = raw.summaryDetail || {};
    const sp = raw.summaryProfile || {};
    const rt = raw.recommendationTrend || {};
    const et = raw.earningsTrend || {};
    const eh = raw.earningsHistory || {};

    const v = (obj) => obj && obj.raw !== undefined ? obj.raw : (obj && obj.fmt ? parseFloat(obj.fmt.replace(/,/g,'')) : null);
    const f = (obj) => obj && obj.fmt ? obj.fmt : '—';

    // Basic info
    const price = v(pr.regularMarketPrice) || v(fd.currentPrice);
    const mcap = v(pr.marketCap);
    const name = pr.longName || pr.shortName || '';
    const exchange = pr.exchangeName || '';
    const sector = sp.sector || '';
    const industry = sp.industry || '';
    const country = sp.country || '';
    const employees = sp.fullTimeEmployees || 0;

    // Margins & profitability
    const grossMargin = v(fd.grossMargins) * 100;
    const opMargin = v(fd.operatingMargins) * 100;
    const netMargin = v(fd.profitMargins) * 100;
    const roe = v(fd.returnOnEquity) * 100;
    const roa = v(fd.returnOnAssets) * 100;

    // Growth
    const revenueGrowth = v(fd.revenueGrowth) ? v(fd.revenueGrowth) * 100 : null;
    const earningsGrowth = v(fd.earningsGrowth) ? v(fd.earningsGrowth) * 100 : null;

    // Valuation
    const pe = v(sd.trailingPE) || v(ks.trailingPE);
    const forwardPe = v(sd.forwardPE) || v(ks.forwardPE);
    const peg = v(ks.pegRatio);
    const evEbitda = v(ks.enterpriseToEbitda);
    const evRevenue = v(ks.enterpriseToRevenue);
    const ev = v(ks.enterpriseValue);
    const priceToBook = v(ks.priceToBook);

    // Cash flow
    const fcf = v(fd.freeCashflow);
    const ocf = v(fd.operatingCashflow);
    const revenue = v(fd.totalRevenue);
    const ebitda = v(fd.ebitda);

    // Debt
    const totalDebt = v(fd.totalDebt);
    const totalCash = v(fd.totalCash);
    const debtEquity = v(fd.debtToEquity) ? v(fd.debtToEquity) / 100 : null;
    const currentRatio = v(fd.currentRatio);

    // EPS
    const eps = v(sd.trailingEPS) || v(ks.trailingEps);
    const forwardEps = v(ks.forwardEps);

    // Dividend
    const divYield = v(sd.dividendYield) ? v(sd.dividendYield) * 100 : 0;
    const divRate = v(sd.dividendRate) || 0;
    const payoutRatio = v(sd.payoutRatio) ? v(sd.payoutRatio) * 100 : null;

    // ROIC estimation: NOPAT / Invested Capital
    // NOPAT ≈ EBIT * (1 - tax rate). We approximate.
    const beta = v(ks.beta) || v(sd.beta);

    // Analyst recommendations
    let analystBuy = 0, analystHold = 0, analystSell = 0;
    if (rt.trend && rt.trend.length > 0) {
        const t = rt.trend[0];
        analystBuy = (t.strongBuy || 0) + (t.buy || 0);
        analystHold = t.hold || 0;
        analystSell = (t.sell || 0) + (t.strongSell || 0);
    }
    const targetPrice = v(fd.targetMeanPrice);
    const targetHigh = v(fd.targetHighPrice);
    const targetLow = v(fd.targetLowPrice);

    // Earnings history (beats)
    let earningsBeats = 0, earningsTotal = 0;
    if (eh.history) {
        eh.history.forEach(h => {
            earningsTotal++;
            if (v(h.surprisePercent) > 0) earningsBeats++;
        });
    }

    // Earnings growth estimate
    let epsGrowthEstimate = null;
    if (et.trend) {
        const nextYear = et.trend.find(t => t.period === '+1y');
        if (nextYear && nextYear.growth) epsGrowthEstimate = v(nextYear.growth) * 100;
    }

    // Derived
    const fcfMargin = (fcf && revenue) ? (fcf / revenue) * 100 : null;
    const fcfYield = (fcf && mcap) ? (fcf / mcap) * 100 : null;
    const earningsYield = pe ? (1 / pe) * 100 : null;
    const debtEbitda = (totalDebt && ebitda && ebitda > 0) ? totalDebt / ebitda : null;
    const netCash = (totalCash && totalDebt) ? totalCash - totalDebt : null;
    const netDebtEbitda = (netCash !== null && ebitda && ebitda > 0) ? -netCash / ebitda : null;

    // ROIC approximation
    let roic = null;
    if (fd.returnOnEquity && debtEquity !== null) {
        // Simplified ROIC = ROE * (Equity / (Equity + Debt)) ≈ ROE / (1 + D/E)
        roic = roe / (1 + (debtEquity || 0));
    }

    // EPS growth YoY from earnings history
    let epsGrowthYoY = earningsGrowth;
    if (!epsGrowthYoY && eh.history && eh.history.length >= 5) {
        const recent = v(eh.history[0].epsActual);
        const yearAgo = v(eh.history[3].epsActual) || v(eh.history[4].epsActual);
        if (recent && yearAgo && yearAgo !== 0) {
            epsGrowthYoY = ((recent - yearAgo) / Math.abs(yearAgo)) * 100;
        }
    }

    // 52-week
    const week52High = v(sd.fiftyTwoWeekHigh);
    const week52Low = v(sd.fiftyTwoWeekLow);

    return {
        name, ticker: pr.symbol || '', exchange, sector, industry, country, employees,
        price, mcap, ev,
        revenue, ebitda, fcf, ocf,
        grossMargin, opMargin, netMargin,
        roe, roa, roic,
        pe, forwardPe, peg, evEbitda, evRevenue, priceToBook,
        eps, forwardEps, epsGrowthYoY, epsGrowthEstimate,
        earningsYield, fcfMargin, fcfYield,
        totalDebt, totalCash, debtEquity, debtEbitda, netCash, netDebtEbitda, currentRatio,
        divYield, divRate, payoutRatio,
        beta, revenueGrowth, earningsGrowth,
        analystBuy, analystHold, analystSell, targetPrice, targetHigh, targetLow,
        earningsBeats, earningsTotal,
        week52High, week52Low
    };
}

// ── SCORING FUNCTIONS ──

function scoreGrowth(revGrowth) {
    if (revGrowth === null) return 2.5;
    if (revGrowth >= 20) return 5;
    if (revGrowth >= 10) return 4;
    if (revGrowth >= 5) return 3;
    if (revGrowth >= 0) return 2;
    return 1;
}

function scoreMargins(opMargin, netMargin) {
    let s = 0;
    if (opMargin >= 25) s += 2.5; else if (opMargin >= 15) s += 2; else if (opMargin >= 8) s += 1.5; else s += 0.5;
    if (netMargin >= 20) s += 2.5; else if (netMargin >= 10) s += 2; else if (netMargin >= 5) s += 1.5; else s += 0.5;
    return s;
}

function scoreFCF(fcfMargin) {
    if (fcfMargin === null) return 2.5;
    if (fcfMargin >= 25) return 5;
    if (fcfMargin >= 15) return 4;
    if (fcfMargin >= 8) return 3;
    if (fcfMargin >= 0) return 2;
    return 1;
}

function scoreROIC(roic) {
    if (roic === null) return 2.5;
    if (roic >= 25) return 5;
    if (roic >= 15) return 4;
    if (roic >= 10) return 3;
    if (roic >= 5) return 2;
    return 1;
}

function scoreDebt(debtEbitda, netDebtEbitda) {
    const d = netDebtEbitda !== null ? netDebtEbitda : debtEbitda;
    if (d === null) return 2.5;
    if (d <= 0) return 5; // net cash
    if (d <= 1) return 4.5;
    if (d <= 2) return 3.5;
    if (d <= 3) return 2.5;
    if (d <= 5) return 1.5;
    return 0.5;
}

function scoreEPSGrowth(g) {
    if (g === null) return 2.5;
    if (g >= 25) return 5;
    if (g >= 15) return 4;
    if (g >= 8) return 3;
    if (g >= 0) return 2;
    return 1;
}

function scoreAnalysts(buy, hold, sell) {
    const total = buy + hold + sell;
    if (total === 0) return 2.5;
    const ratio = buy / total;
    if (ratio >= 0.7) return 5;
    if (ratio >= 0.5) return 4;
    if (ratio >= 0.35) return 3;
    return 2;
}

function scoreEarningsBeats(beats, total) {
    if (total === 0) return 2.5;
    const ratio = beats / total;
    if (ratio >= 0.9) return 5;
    if (ratio >= 0.7) return 4;
    if (ratio >= 0.5) return 3;
    return 2;
}

function scorePER(pe) {
    if (pe === null || pe <= 0) return 2.5;
    if (pe <= 10) return 5;
    if (pe <= 15) return 4;
    if (pe <= 20) return 3;
    if (pe <= 30) return 2;
    return 1;
}

function scorePEG(peg) {
    if (peg === null || peg <= 0) return 2.5;
    if (peg <= 0.5) return 5;
    if (peg <= 1) return 4.5;
    if (peg <= 1.5) return 3.5;
    if (peg <= 2) return 2.5;
    if (peg <= 3) return 1.5;
    return 0.5;
}

function scoreEVEBITDA(ev) {
    if (ev === null || ev <= 0) return 2.5;
    if (ev <= 8) return 5;
    if (ev <= 12) return 4;
    if (ev <= 16) return 3;
    if (ev <= 22) return 2;
    return 1;
}

// ── CALCULATE RANKINGS ──
function calculateRankings(d) {
    // 1. FUNDAMENTAL: Solidez (60%) + Momentum (40%)
    const s_growth = scoreGrowth(d.revenueGrowth);
    const s_margins = scoreMargins(d.opMargin, d.netMargin);
    const s_fcf = scoreFCF(d.fcfMargin);
    const s_roic = scoreROIC(d.roic);
    const s_debt = scoreDebt(d.debtEbitda, d.netDebtEbitda);

    const solidez = (s_growth * 0.15 + s_margins * 0.15 + s_fcf * 0.15 + s_roic * 0.10 + s_debt * 0.10) / 0.65 * 1; // normalize
    const solidezScore = s_growth * (15/65) + s_margins * (15/65) + s_fcf * (15/65) + s_roic * (10/65) + s_debt * (10/65);
    const solidezFinal = (s_growth * 0.15 + s_margins * 0.15 + s_fcf * 0.15 + s_roic * 0.10 + s_debt * 0.10) / 0.65;

    const s_epsGrowth = scoreEPSGrowth(d.epsGrowthYoY);
    const s_analysts = scoreAnalysts(d.analystBuy, d.analystHold, d.analystSell);
    const s_beats = scoreEarningsBeats(d.earningsBeats, d.earningsTotal);

    const momentumFinal = (s_epsGrowth * 0.375 + s_analysts * 0.375 + s_beats * 0.25);

    const fundamentalScore = solidezFinal * 0.60 + momentumFinal * 0.40;

    // 2. GREENBLATT: ROIC (50%) + Earnings Yield via EV/EBITDA (50%)
    const g_roic = scoreROIC(d.roic);
    const g_evEbitda = scoreEVEBITDA(d.evEbitda);
    const greenblattScore = g_roic * 0.50 + g_evEbitda * 0.50;

    // 3. LYNCH: PER (50%) + PEG (50%)
    const l_per = scorePER(d.pe);
    const l_peg = scorePEG(d.peg);
    const lynchScore = l_per * 0.50 + l_peg * 0.50;

    // Average
    const avgScore = (fundamentalScore + greenblattScore + lynchScore) / 3;

    return {
        fundamental: { score: fundamentalScore, solidez: solidezFinal, momentum: momentumFinal,
            details: { growth: s_growth, margins: s_margins, fcf: s_fcf, roic: s_roic, debt: s_debt,
                       epsGrowth: s_epsGrowth, analysts: s_analysts, beats: s_beats } },
        greenblatt: { score: greenblattScore, details: { roic: g_roic, evEbitda: g_evEbitda } },
        lynch: { score: lynchScore, details: { per: l_per, peg: l_peg } },
        average: avgScore
    };
}

// ── HELPERS ──
function fmt(n, dec=1) { return n !== null && n !== undefined && !isNaN(n) ? n.toFixed(dec) : '—'; }
function fmtB(n) {
    if (n === null || n === undefined) return '—';
    const abs = Math.abs(n);
    if (abs >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
    if (abs >= 1e9) return '$' + (n/1e9).toFixed(1) + 'B';
    if (abs >= 1e6) return '$' + (n/1e6).toFixed(0) + 'M';
    return '$' + n.toLocaleString();
}
function fmtP(n) { return n !== null && !isNaN(n) ? n.toFixed(1) + '%' : '—'; }
function stars(score) {
    const full = Math.round(score);
    return '⭐'.repeat(Math.min(full, 5));
}
function scoreClassLabel(score) {
    if (score >= 4.5) return 'Excepcional';
    if (score >= 4.0) return 'Premium';
    if (score >= 3.5) return 'Interesante';
    if (score >= 3.0) return 'Aceptable';
    if (score >= 2.5) return 'Cara';
    if (score >= 2.0) return 'Poco Atractiva';
    return 'Evitar';
}
function icon(val, thresholds) {
    // thresholds = [great, good, ok] — above great = ✅✅✅, above good = ✅✅, above ok = ✅, below = ⚠️/❌
    if (val === null || val === undefined) return '';
    if (val >= thresholds[0]) return ' ✅✅✅';
    if (val >= thresholds[1]) return ' ✅✅';
    if (val >= thresholds[2]) return ' ✅';
    if (val >= 0) return ' ⚠️';
    return ' ❌';
}
function iconInv(val, thresholds) {
    // Inverted: lower is better (PER, debt, etc.)
    if (val === null || val === undefined) return '';
    if (val <= thresholds[0]) return ' ✅✅✅';
    if (val <= thresholds[1]) return ' ✅✅';
    if (val <= thresholds[2]) return ' ✅';
    return ' ⚠️';
}
function colorClass(val, thresholds, inverted=false) {
    if (val === null || val === undefined) return '';
    if (!inverted) {
        if (val >= thresholds[0]) return 'green';
        if (val >= thresholds[1]) return 'green';
        if (val >= thresholds[2]) return 'orange';
        return 'red';
    } else {
        if (val <= thresholds[0]) return 'green';
        if (val <= thresholds[1]) return 'green';
        if (val <= thresholds[2]) return 'orange';
        return 'red';
    }
}

// ── BUILD STRENGTHS/WEAKNESSES ──
function buildAnalysis(d, r) {
    const strengths = [];
    const weaknesses = [];

    if (d.roic >= 20) strengths.push(`✅ ROIC ${fmt(d.roic)}%: Asignación de capital excepcional`);
    else if (d.roic < 8) weaknesses.push(`⚠️ ROIC bajo: ${fmt(d.roic)}%`);

    if (d.fcfMargin >= 20) strengths.push(`✅ FCF ${fmtB(d.fcf)}: Generación de caja ${fmt(d.fcfMargin)}% sobre ingresos`);
    else if (d.fcfMargin !== null && d.fcfMargin < 5) weaknesses.push(`⚠️ FCF bajo: ${fmt(d.fcfMargin)}% sobre ingresos`);

    if (d.opMargin >= 20) strengths.push(`✅ Margen operativo fuerte: ${fmt(d.opMargin)}%`);
    else if (d.opMargin < 8) weaknesses.push(`⚠️ Margen operativo débil: ${fmt(d.opMargin)}%`);

    if (d.netMargin >= 15) strengths.push(`✅ Margen neto alto: ${fmt(d.netMargin)}%`);

    if (d.epsGrowthYoY >= 15) strengths.push(`✅ Crecimiento BPA: +${fmt(d.epsGrowthYoY)}% YoY`);
    else if (d.epsGrowthYoY !== null && d.epsGrowthYoY < 0) weaknesses.push(`⚠️ BPA en descenso: ${fmt(d.epsGrowthYoY)}% YoY`);

    if (d.revenueGrowth >= 10) strengths.push(`✅ Crecimiento ingresos: +${fmt(d.revenueGrowth)}%`);
    else if (d.revenueGrowth !== null && d.revenueGrowth < 0) weaknesses.push(`⚠️ Ingresos en descenso: ${fmt(d.revenueGrowth)}%`);

    if (d.netCash > 0) strengths.push(`✅ Posición neta de caja: ${fmtB(d.netCash)}`);
    if (d.debtEbitda !== null && d.debtEbitda > 3) weaknesses.push(`⚠️ Deuda elevada: ${fmt(d.debtEbitda)}x EBITDA`);
    else if (d.debtEbitda !== null && d.debtEbitda <= 1) strengths.push(`✅ Deuda baja: ${fmt(d.debtEbitda)}x EBITDA`);

    if (d.divYield >= 3) strengths.push(`✅ Dividendo atractivo: ${fmt(d.divYield)}% yield`);

    if (d.analystBuy > d.analystHold + d.analystSell) strengths.push(`✅ Consenso analistas positivo: ${d.analystBuy} Buy vs ${d.analystHold} Hold`);

    if (d.earningsBeats >= 3 && d.earningsTotal >= 4) strengths.push(`✅ Beat en ${d.earningsBeats}/${d.earningsTotal} últimos trimestres`);

    if (d.peg !== null && d.peg <= 1) strengths.push(`✅ PEG ${fmt(d.peg,2)}: Infravalorada según Lynch`);
    else if (d.peg !== null && d.peg > 2.5) weaknesses.push(`⚠️ PEG ${fmt(d.peg,2)}: Sobrevalorada`);

    if (d.pe > 30) weaknesses.push(`⚠️ PER ${fmt(d.pe)}x: Valoración exigente`);
    else if (d.pe !== null && d.pe <= 15 && d.pe > 0) strengths.push(`✅ PER ${fmt(d.pe)}x: Valoración atractiva`);

    if (d.evEbitda > 20) weaknesses.push(`⚠️ EV/EBITDA ${fmt(d.evEbitda)}x: Caro`);
    else if (d.evEbitda !== null && d.evEbitda <= 12) strengths.push(`✅ EV/EBITDA ${fmt(d.evEbitda)}x: Valoración atractiva`);

    if (d.earningsYield !== null && d.earningsYield < 4) weaknesses.push(`⚠️ Earnings Yield ${fmt(d.earningsYield)}%: Bajo margen de seguridad`);

    if (d.currentRatio !== null && d.currentRatio < 1) weaknesses.push(`⚠️ Current Ratio ${fmt(d.currentRatio,2)}x: Liquidez ajustada`);

    if (d.payoutRatio !== null && d.payoutRatio > 80) weaknesses.push(`⚠️ Payout Ratio ${fmt(d.payoutRatio,0)}%: Alto`);

    return { strengths, weaknesses };
}

// ── RECOMMENDATION ──
function getRecommendation(avg, d) {
    if (avg >= 4.0) return { text: 'MUY INTERESANTE', cls: 'rec-green', emoji: '🚀' };
    if (avg >= 3.5) return { text: 'INTERESANTE', cls: 'rec-green', emoji: '🎯' };
    if (avg >= 3.0) return { text: 'INTERESANTE CON CAUTELA', cls: 'rec-yellow', emoji: '🎯' };
    if (avg >= 2.5) return { text: 'NEUTRAL — VIGILAR', cls: 'rec-yellow', emoji: '⚠️' };
    return { text: 'EVITAR', cls: 'rec-red', emoji: '🚨' };
}

            <div class="score-circle"><div class="score-content">
                <div class="score-number">${fmt(r.greenblatt.score,2)}</div>
                <div class="score-max">/5.00</div>
                <div class="score-stars">${stars(r.greenblatt.score)}</div>
            </div></div>
            <div class="score-label-box">${scoreClassLabel(r.greenblatt.score)}</div>
            <div class="metrics">
                <div class="metric"><span class="metric-label">ROIC</span><span class="metric-value">${fmtP(d.roic)}${icon(d.roic, [25, 15, 8])}</span></div>
                <div class="metric"><span class="metric-label">Score ROIC</span><span class="metric-value">${fmt(r.greenblatt.details.roic,1)}/5 ${stars(r.greenblatt.details.roic)}</span></div>
                <div class="metric"><span class="metric-label">EV/EBITDA</span><span class="metric-value">${d.evEbitda ? fmt(d.evEbitda)+'x' : '—'}${d.evEbitda ? iconInv(d.evEbitda, [8, 12, 18]) : ''}</span></div>
                <div class="metric"><span class="metric-label">Score EV/EBITDA</span><span class="metric-value">${fmt(r.greenblatt.details.evEbitda,1)}/5 ${stars(r.greenblatt.details.evEbitda)}</span></div>
                <div class="metric"><span class="metric-label">Enterprise Value</span><span class="metric-value">${fmtB(d.ev)}</span></div>
                <div class="metric"><span class="metric-label">Earnings Yield</span><span class="metric-value">${fmtP(d.earningsYield)}${icon(d.earningsYield, [8, 5, 3])}</span></div>
            </div>
        </div>

        <div class="ranking-card">
            <div class="ranking-icon">💎</div>
            <div class="ranking-title">INDICADOR LYNCH</div>
            <div class="score-circle"><div class="score-content">
                <div class="score-number">${fmt(r.lynch.score,2)}</div>
                <div class="score-max">/5.00</div>
                <div class="score-stars">${stars(r.lynch.score)}</div>
            </div></div>
            <div class="score-label-box">${scoreClassLabel(r.lynch.score)}</div>
            <div class="metrics">
                <div class="metric"><span class="metric-label">PER</span><span class="metric-value">${d.pe ? fmt(d.pe)+'x' : '—'}${d.pe ? iconInv(d.pe, [12, 18, 25]) : ''}</span></div>
                <div class="metric"><span class="metric-label">Score PER</span><span class="metric-value">${fmt(r.lynch.details.per,1)}/5 ${stars(r.lynch.details.per)}</span></div>
                <div class="metric"><span class="metric-label">PEG</span><span class="metric-value">${d.peg ? fmt(d.peg,2) : '—'}${d.peg ? iconInv(d.peg, [1, 1.5, 2.5]) : ''}</span></div>
                <div class="metric"><span class="metric-label">Score PEG</span><span class="metric-value">${fmt(r.lynch.details.peg,1)}/5 ${stars(r.lynch.details.peg)}</span></div>
                <div class="metric"><span class="metric-label">Crecimiento BPA</span><span class="metric-value">${d.epsGrowthYoY !== null ? (d.epsGrowthYoY >= 0 ? '+' : '')+fmt(d.epsGrowthYoY)+'%' : '—'}${icon(d.epsGrowthYoY, [20, 10, 3])}</span></div>
                ${d.divYield > 0 ? `<div class="metric"><span class="metric-label">Dividend Yield</span><span class="metric-value">${fmt(d.divYield)}%${icon(d.divYield, [5, 3, 1.5])}</span></div>` : ''}
            </div>
        </div>
    </div>

    <!-- FINANCIALS -->
    <div class="financials-grid">
        <div class="fin-card">
            <div class="fin-title">💵 Cuenta de Resultados</div>
            <div class="fin-row"><span class="fin-label">Ingresos</span><span class="fin-value">${fmtB(d.revenue)}</span></div>
            <div class="fin-row"><span class="fin-label">Crecimiento</span><span class="fin-value ${colorClass(d.revenueGrowth, [10, 3, 0])}">${d.revenueGrowth !== null ? (d.revenueGrowth >= 0 ? '+' : '')+fmt(d.revenueGrowth)+'%' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">EBITDA</span><span class="fin-value">${fmtB(d.ebitda)}</span></div>
            <div class="fin-row"><span class="fin-label">Margen Bruto</span><span class="fin-value ${colorClass(d.grossMargin, [40, 25, 15])}">${fmtP(d.grossMargin)}</span></div>
            <div class="fin-row"><span class="fin-label">Margen Operativo</span><span class="fin-value ${colorClass(d.opMargin, [25, 15, 8])}">${fmtP(d.opMargin)}</span></div>
            <div class="fin-row"><span class="fin-label">Margen Neto</span><span class="fin-value ${colorClass(d.netMargin, [20, 10, 5])}">${fmtP(d.netMargin)}</span></div>
            <div class="fin-row"><span class="fin-label">BPA</span><span class="fin-value">$${fmt(d.eps,2)}</span></div>
            <div class="fin-row"><span class="fin-label">BPA Forward</span><span class="fin-value">$${d.forwardEps ? fmt(d.forwardEps,2) : '—'}</span></div>
        </div>

        <div class="fin-card">
            <div class="fin-title">🏦 Balance y Liquidez</div>
            <div class="fin-row"><span class="fin-label">Deuda Total</span><span class="fin-value ${d.totalDebt > 0 ? 'orange' : ''}">${fmtB(d.totalDebt)}</span></div>
            <div class="fin-row"><span class="fin-label">Cash</span><span class="fin-value green">${fmtB(d.totalCash)}</span></div>
            <div class="fin-row"><span class="fin-label">Posición Neta</span><span class="fin-value ${d.netCash > 0 ? 'green' : 'red'}">${fmtB(d.netCash)}${d.netCash > 0 ? ' ✅' : ''}</span></div>
            <div class="fin-row"><span class="fin-label">Deuda/EBITDA</span><span class="fin-value ${colorClass(d.debtEbitda, [1, 2, 3], true)}">${d.debtEbitda !== null ? fmt(d.debtEbitda)+'x' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">Deuda/Equity</span><span class="fin-value ${colorClass(d.debtEquity, [0.5, 1, 2], true)}">${d.debtEquity !== null ? fmt(d.debtEquity,2)+'x' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">Current Ratio</span><span class="fin-value ${d.currentRatio && d.currentRatio < 1 ? 'orange' : 'green'}">${d.currentRatio ? fmt(d.currentRatio,2)+'x' : '—'}</span></div>
        </div>

        <div class="fin-card">
            <div class="fin-title">💰 Cash Flow y Rentabilidad</div>
            <div class="fin-row"><span class="fin-label">Operating Cash Flow</span><span class="fin-value green">${fmtB(d.ocf)}</span></div>
            <div class="fin-row"><span class="fin-label">Free Cash Flow</span><span class="fin-value green">${fmtB(d.fcf)}</span></div>
            <div class="fin-row"><span class="fin-label">FCF/Ingresos</span><span class="fin-value ${colorClass(d.fcfMargin, [20, 12, 5])}">${fmtP(d.fcfMargin)}</span></div>
            <div class="fin-row"><span class="fin-label">FCF Yield</span><span class="fin-value ${colorClass(d.fcfYield, [6, 4, 2])}">${fmtP(d.fcfYield)}</span></div>
            <div class="fin-row"><span class="fin-label">ROIC</span><span class="fin-value ${colorClass(d.roic, [20, 12, 8])}">${fmtP(d.roic)}</span></div>
            <div class="fin-row"><span class="fin-label">ROE</span><span class="fin-value ${colorClass(d.roe, [20, 12, 8])}">${fmtP(d.roe)}</span></div>
            <div class="fin-row"><span class="fin-label">ROA</span><span class="fin-value ${colorClass(d.roa, [10, 5, 2])}">${fmtP(d.roa)}</span></div>
            ${d.divYield > 0 ? `<div class="fin-row"><span class="fin-label">Dividend Yield</span><span class="fin-value green">${fmt(d.divYield)}%</span></div>` : ''}
            ${d.payoutRatio ? `<div class="fin-row"><span class="fin-label">Payout Ratio</span><span class="fin-value ${d.payoutRatio > 80 ? 'orange' : 'green'}">${fmt(d.payoutRatio,0)}%</span></div>` : ''}
        </div>
    </div>

    <!-- VALORACIÓN + ANALISTAS -->
    <div class="financials-grid">
        <div class="fin-card">
            <div class="fin-title">📊 Valoración</div>
            <div class="fin-row"><span class="fin-label">PER (Trailing)</span><span class="fin-value ${colorClass(d.pe, [15, 20, 30], true)}">${d.pe ? fmt(d.pe)+'x' : '—'}${d.pe ? (d.pe <= 15 ? ' ✅' : d.pe > 30 ? ' ⚠️' : '') : ''}</span></div>
            <div class="fin-row"><span class="fin-label">PER (Forward)</span><span class="fin-value ${colorClass(d.forwardPe, [15, 20, 30], true)}">${d.forwardPe ? fmt(d.forwardPe)+'x' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">PEG</span><span class="fin-value ${d.peg && d.peg <= 1.5 ? 'green' : d.peg ? 'orange' : ''}">${d.peg ? fmt(d.peg,2) : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">EV/EBITDA</span><span class="fin-value ${colorClass(d.evEbitda, [10, 15, 22], true)}">${d.evEbitda ? fmt(d.evEbitda)+'x' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">EV/Revenue</span><span class="fin-value">${d.evRevenue ? fmt(d.evRevenue)+'x' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">P/Book</span><span class="fin-value">${d.priceToBook ? fmt(d.priceToBook)+'x' : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">Earnings Yield</span><span class="fin-value ${colorClass(d.earningsYield, [8, 5, 3])}">${fmtP(d.earningsYield)}</span></div>
        </div>

        <div class="fin-card">
            <div class="fin-title">🎯 Consenso Analistas</div>
            <div class="fin-row"><span class="fin-label">Buy</span><span class="fin-value green">${d.analystBuy} analistas</span></div>
            <div class="fin-row"><span class="fin-label">Hold</span><span class="fin-value orange">${d.analystHold} analistas</span></div>
            <div class="fin-row"><span class="fin-label">Sell</span><span class="fin-value red">${d.analystSell} analistas</span></div>
            <div class="fin-row"><span class="fin-label">Price Target Medio</span><span class="fin-value ${upside > 0 ? 'green' : 'red'}">$${d.targetPrice ? fmt(d.targetPrice,2) : '—'}${upside !== null ? ` (${upside >= 0 ? '+' : ''}${fmt(upside)}%)` : ''}</span></div>
            <div class="fin-row"><span class="fin-label">PT Máximo</span><span class="fin-value">$${d.targetHigh ? fmt(d.targetHigh,2) : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">PT Mínimo</span><span class="fin-value">$${d.targetLow ? fmt(d.targetLow,2) : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">52W Rango</span><span class="fin-value">$${d.week52Low ? fmt(d.week52Low,2) : '—'} — $${d.week52High ? fmt(d.week52High,2) : '—'}</span></div>
            <div class="fin-row"><span class="fin-label">Beta</span><span class="fin-value">${d.beta ? fmt(d.beta,2) : '—'}</span></div>
        </div>
    </div>

    <!-- FORTALEZAS / DEBILIDADES -->
    <div class="analysis-grid">
        <div class="analysis-card">
            <div class="analysis-title green">✅ Fortalezas</div>
            ${analysis.strengths.length > 0 ? analysis.strengths.map(s => `<div class="analysis-item strength">${s}</div>`).join('') : '<div class="analysis-item strength">Sin fortalezas destacables identificadas</div>'}
        </div>
        <div class="analysis-card">
            <div class="analysis-title red">⚠️ Riesgos y Debilidades</div>
            ${analysis.weaknesses.length > 0 ? analysis.weaknesses.map(w => `<div class="analysis-item weakness">${w}</div>`).join('') : '<div class="analysis-item weakness">Sin debilidades destacables identificadas</div>'}
        </div>
    </div>

    <!-- CONCLUSIÓN -->
    <div class="conclusion">
        <h3>💡 Conclusión Final</h3>
        <p style="font-size:1.1em; color:#555; margin-bottom:15px;">
            <strong>Puntuación Promedio: ${fmt(r.average,2)}/5</strong> ${stars(r.average)}
        </p>
        <p style="color:#555; margin-bottom:15px; font-size:1.05em;">
            Fundamental: <strong>${fmt(r.fundamental.score,2)}</strong> · Greenblatt: <strong>${fmt(r.greenblatt.score,2)}</strong> · Lynch: <strong>${fmt(r.lynch.score,2)}</strong>
        </p>
        <div class="recommendation ${rec.cls}">${rec.emoji} RECOMENDACIÓN: ${rec.text}</div>
        <div class="investor-grid">
            <div class="investor-item ${r.fundamental.score >= 3.5 ? 'yes' : r.fundamental.score >= 2.5 ? 'maybe' : 'no'}">${r.fundamental.score >= 3.5 ? '✅' : '⚠️'} Calidad/Growth<br><small>Fundamental: ${fmt(r.fundamental.score,2)}/5</small></div>
            <div class="investor-item ${r.greenblatt.score >= 3.5 ? 'yes' : r.greenblatt.score >= 2.5 ? 'maybe' : 'no'}">${r.greenblatt.score >= 3.5 ? '✅' : '⚠️'} Value (Greenblatt)<br><small>Score: ${fmt(r.greenblatt.score,2)}/5</small></div>
            <div class="investor-item ${r.lynch.score >= 3.5 ? 'yes' : r.lynch.score >= 2.5 ? 'maybe' : 'no'}">${r.lynch.score >= 3.5 ? '✅' : '⚠️'} Value (Lynch)<br><small>PER+PEG: ${fmt(r.lynch.score,2)}/5</small></div>
        </div>
    </div>

    <div class="footer">
        <div>📅 Análisis generado el ${new Date().toLocaleDateString('es-ES')} · ${d.exchange}: ${d.ticker} · ETHAN Mercados</div>
        <div style="margin-top:8px; opacity:0.8;">⚠️ Este análisis no constituye asesoramiento financiero. Datos de Yahoo Finance.</div>
    </div>
    `;

    document.getElementById('results').innerHTML = html;
    document.getElementById('results').classList.add('active');
}

// ── MAIN ──
// Show API key status on load
document.addEventListener('DOMContentLoaded', () => {
    const status = document.getElementById('apiStatus');
    if (FMP_KEY) {
        const masked = FMP_KEY.substring(0, 4) + '...' + FMP_KEY.substring(FMP_KEY.length - 4);
        status.innerHTML = `🔑 API Key: <strong>${masked}</strong> · <a href="#" onclick="changeApiKey();return false;" style="color:#1e3a5f;">Cambiar</a>`;
    } else {
        showApiKeyPrompt();
    }
});

function changeApiKey() {
    localStorage.removeItem('fmp_api_key');
    FMP_KEY = '';
    showApiKeyPrompt();
    document.getElementById('apiStatus').innerHTML = '';
}

async function runAnalysis() {
    const ticker = document.getElementById('tickerInput').value.trim().toUpperCase();
    if (!ticker) return;

    const btn = document.getElementById('searchBtn');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    const results = document.getElementById('results');

    btn.disabled = true;
    loading.classList.add('active');
    errorBox.classList.remove('active');
    results.classList.remove('active');

    try {
        document.getElementById('loadingText').textContent = `Obteniendo datos de ${ticker}...`;
        const raw = await fetchYahooData(ticker);

        document.getElementById('loadingText').textContent = 'Calculando rankings...';
        const data = extractData(raw);
        const rankings = calculateRankings(data);

        loading.classList.remove('active');
        renderResults(data, rankings);

        // Scroll to results
        document.querySelector('.company-card').scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
        loading.classList.remove('active');
        errorBox.textContent = `❌ Error: ${err.message}`;
        errorBox.classList.add('active');
    } finally {
        btn.disabled = false;
    }
}
</script>
</body>
</html>
